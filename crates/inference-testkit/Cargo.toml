[package]
name = "inference-testkit"
description = "Test utilities of the inference framework: in-memory stores per domain and, behind features, the run stores and the mocks of the contracts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
run = ["dep:inference-runtime", "dep:inference-facade"]
stt = ["dep:inference-stt"]
llm = ["dep:inference-llm", "inference-llm/tools"]
tts = ["dep:inference-tts"]
duplex = []

[dependencies]
inference-core = { path = "../inference-core" }
inference-facade = { path = "../inference-facade", optional = true }
inference-duplex = { path = "../inference-duplex" }
inference-llm = { path = "../inference-llm", optional = true }
inference-pipeline = { path = "../inference-pipeline" }
inference-runtime = { path = "../inference-runtime", optional = true }
inference-stt = { path = "../inference-stt", optional = true }
inference-text = { path = "../inference-text" }
inference-tools = { path = "../inference-tools" }
inference-tts = { path = "../inference-tts", optional = true }
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
ess-conformance = { git = "https://github.com/beyond10x/ess", tag = "0.75.0" }
ess-primitives = { git = "https://github.com/beyond10x/ess", tag = "0.75.0" }
serde.workspace = true

[[test]]
name = "conform"
required-features = ["run"]

[[test]]
name = "adversary1_planning"
required-features = ["run"]

[[test]]
name = "adversary1_run_target"
required-features = ["run"]

[[test]]
name = "adversary1_target"
required-features = ["run"]

[[test]]
name = "adversary10_validation_force"
required-features = ["run"]

[[test]]
name = "adversary2_stream_deferred"
required-features = ["run"]

[[test]]
name = "adversary2_stream_tokens"
required-features = ["run"]

[[test]]
name = "adversary3_target_sequence"
required-features = ["run"]

[[test]]
name = "adversary8_graph_views"
required-features = ["run"]

[lints]
workspace = true
