[package]
name = "inference-pipeline"
description = "Pipeline graphs of the inference framework: nodes with typed ports, bounded edges and adapter bindings, declared by command, through a typed builder or from a JSON definition checked against node descriptors."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
stt = ["dep:inference-stt"]
llm = ["dep:inference-llm", "inference-llm/tools"]
tts = ["dep:inference-tts"]
duplex = ["dep:inference-duplex"]

[dependencies]
inference-audio = { path = "../inference-audio" }
inference-core = { path = "../inference-core" }
inference-duplex = { path = "../inference-duplex", optional = true }
inference-llm = { path = "../inference-llm", optional = true }
inference-stt = { path = "../inference-stt", optional = true }
inference-text = { path = "../inference-text" }
inference-tools = { path = "../inference-tools" }
inference-tts = { path = "../inference-tts", optional = true }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
