[book]
title = "inference"
description = "Open-source Rust framework for speech and language AI. Swap the model. Keep the product."
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "coal"
preferred-dark-theme = "coal"
additional-css = ["theme/inference.css"]
git-repository-url = "https://github.com/beyond10x/inference"
git-repository-icon = "fab-github"
no-section-label = true

[output.html.search]
enable = true
