name: pages

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MDBOOK_VERSION: v0.5.4
      MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install mdBook
        run: |
          set -euo pipefail
          asset="mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$asset" \
            "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/$asset"
          echo "${MDBOOK_SHA256}  $RUNNER_TEMP/$asset" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/mdbook-bin"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/mdbook-bin"
          echo "$RUNNER_TEMP/mdbook-bin" >> "$GITHUB_PATH"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Build
        run: mdbook build site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site/book

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
