name: check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: inference / task check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Scope of the change
        id: scope
        shell: sh
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          gate=full
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/changed-paths"
            if [ -s "$RUNNER_TEMP/changed-paths" ]; then
              gate=planning
            fi
            while IFS= read -r path; do
              case "$path" in
                website/* | ess/* | CHANGELOG.md) gate=full ;;
                .engineering/* | *.md) ;;
                *) gate=full ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          fi
          echo "gate=$gate" >> "$GITHUB_OUTPUT"
          echo "gate: $gate"

      - name: Install the Rust toolchain rust-toolchain.toml pins
        if: steps.scope.outputs.gate == 'full'
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
          rustc --version

      - name: Install go-task
        if: steps.scope.outputs.gate == 'full'
        env:
          TASK_VERSION: "3.52.0"
          TASK_SHA256: 02c679ffae53dca791804847d78b31731615894e292948397c971c87ac9e95bd
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/task.tar.gz" \
            "https://github.com/go-task/task/releases/download/v$TASK_VERSION/task_linux_amd64.tar.gz"
          echo "$TASK_SHA256  $RUNNER_TEMP/task.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/task-bin"
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$RUNNER_TEMP/task-bin" task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"

      - name: Install cargo-nextest
        if: steps.scope.outputs.gate == 'full'
        env:
          NEXTEST_VERSION: "0.9.143"
          NEXTEST_SHA256: 66786b9abe23920d022a182d1416b1bbc8130dd4872a9553d76985a1708dcd1e
        run: |
          set -euo pipefail
          asset="cargo-nextest-$NEXTEST_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$asset" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/$asset"
          echo "$NEXTEST_SHA256  $RUNNER_TEMP/$asset" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/nextest-bin"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/nextest-bin" cargo-nextest
          echo "$RUNNER_TEMP/nextest-bin" >> "$GITHUB_PATH"

      - name: Install ess
        if: steps.scope.outputs.gate == 'full'
        env:
          ESS_VERSION: "0.98.0"
          ESS_SHA256: c6c9a3a3d6956ce1a237f0340905dfadc431d31b1a15b104a6d2e64bb5acaa8e
        run: |
          set -euo pipefail
          asset="ess-$ESS_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          release="https://github.com/beyond10x/ess/releases/download/$ESS_VERSION"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output "$asset" "$release/$asset"
          curl --fail --silent --show-error --location --output SHA256SUMS "$release/SHA256SUMS"
          grep -Fx "$ESS_SHA256  $asset" SHA256SUMS
          grep -F "  $asset" SHA256SUMS | sha256sum --check --strict
          tar -xzf "$asset"
          echo "$RUNNER_TEMP/ess-$ESS_VERSION-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"

      - name: Install aep
        env:
          AEP_VERSION: "0.80.0"
          AEP_SHA256: 9277f3977397b540767497917bdb9666719249364901c466939343d1787d502a
        run: |
          set -euo pipefail
          asset="aep-$AEP_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          release="https://github.com/beyond10x/aep/releases/download/$AEP_VERSION"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output "$asset" "$release/$asset"
          curl --fail --silent --show-error --location --output AEP_SHA256SUMS "$release/SHA256SUMS"
          grep -Fx "$AEP_SHA256  $asset" AEP_SHA256SUMS
          grep -F "  $asset" AEP_SHA256SUMS | sha256sum --check --strict
          tar -xzf "$asset"
          install -D -m 755 "$RUNNER_TEMP/aep-$AEP_VERSION-x86_64-unknown-linux-gnu/aep" "$RUNNER_TEMP/aep-bin/aep"
          echo "$RUNNER_TEMP/aep-bin" >> "$GITHUB_PATH"

      - name: Planning store validation
        if: steps.scope.outputs.gate == 'planning'
        run: aep plan artifact validate

      - name: Install native build dependencies
        if: steps.scope.outputs.gate == 'full'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libasound2-dev libclang-dev cmake

      - name: task check-source
        if: steps.scope.outputs.gate == 'full'
        run: task check-source

      - name: task test-build
        if: steps.scope.outputs.gate == 'full'
        run: task test-build

      - name: task test-run
        if: steps.scope.outputs.gate == 'full'
        run: task test-run
