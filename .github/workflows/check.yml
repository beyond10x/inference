name: check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: inference / task check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install go-task
        env:
          TASK_VERSION: "3.52.0"
          TASK_SHA256: 02c679ffae53dca791804847d78b31731615894e292948397c971c87ac9e95bd
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/task.tar.gz" \
            "https://github.com/go-task/task/releases/download/v$TASK_VERSION/task_linux_amd64.tar.gz"
          echo "$TASK_SHA256  $RUNNER_TEMP/task.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/task-bin"
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$RUNNER_TEMP/task-bin" task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"

      - name: Install ess
        env:
          ESS_VERSION: "0.67.0"
          ESS_SHA256: 7ae57d8d627227784c7a309a1a3d4cccda61b626cbab1749179af9f4f3451e8c
        run: |
          set -euo pipefail
          asset="ess-$ESS_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          release="https://github.com/beyond10x/ess/releases/download/$ESS_VERSION"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output "$asset" "$release/$asset"
          curl --fail --silent --show-error --location --output SHA256SUMS "$release/SHA256SUMS"
          grep -Fx "$ESS_SHA256  $asset" SHA256SUMS
          grep -F "  $asset" SHA256SUMS | sha256sum --check --strict
          tar -xzf "$asset"
          echo "$RUNNER_TEMP/ess-$ESS_VERSION-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"

      - name: Install aep
        env:
          AEP_VERSION: "0.74.0"
          AEP_SHA256: 50b38744290954a345f2c91ee3f22019c36bdc3353c71929db5ec4a638c6f23a
        run: |
          set -euo pipefail
          asset="aep-$AEP_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          release="https://github.com/beyond10x/aep/releases/download/$AEP_VERSION"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output "$asset" "$release/$asset"
          curl --fail --silent --show-error --location --output AEP_SHA256SUMS "$release/SHA256SUMS"
          grep -Fx "$AEP_SHA256  $asset" AEP_SHA256SUMS
          grep -F "  $asset" AEP_SHA256SUMS | sha256sum --check --strict
          tar -xzf "$asset"
          install -D -m 755 "$RUNNER_TEMP/aep-$AEP_VERSION-x86_64-unknown-linux-gnu/aep" "$RUNNER_TEMP/aep-bin/aep"
          echo "$RUNNER_TEMP/aep-bin" >> "$GITHUB_PATH"

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libasound2-dev libclang-dev cmake

      - name: task check
        run: task check
