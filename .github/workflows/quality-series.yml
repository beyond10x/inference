name: quality series

on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-series
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  SERIES_REF: refs/ratchet/records

jobs:
  append:
    name: append the quality records of main to a commit of the series
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      appended: ${{ steps.append.outputs.appended }}
      base: ${{ steps.append.outputs.base }}
      bundle: ${{ steps.append.outputs.bundle }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Install the Rust toolchain rust-toolchain.toml pins
        shell: sh
        run: |
          set -eu
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          rustc --version

      - name: Build inference-docs
        shell: sh
        run: cargo build --locked -q -p inference-docs

      - name: Download the records of the check run
        id: download
        shell: sh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "quality-records-$HEAD_SHA" --dir "$RUNNER_TEMP/records"

      - name: Append the records to a commit of the series
        id: append
        shell: sh
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DOCS: target/debug/inference-docs
        run: |
          set -eu
          records="$RUNNER_TEMP/records"
          series="$RUNNER_TEMP/series"
          bundle="$RUNNER_TEMP/series.bundle"
          remote="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          git -c init.defaultBranch=series init -q "$series"
          found=0
          git -C "$series" ls-remote --exit-code "$remote" "$SERIES_REF" > /dev/null || found=$?
          if [ "$found" -eq 0 ]; then
            git -C "$series" fetch -q --no-tags "$remote" "$SERIES_REF"
            git -C "$series" reset -q --hard FETCH_HEAD
            base=$(git -C "$series" rev-parse HEAD)
          elif [ "$found" -eq 2 ]; then
            base=
            echo "quality-series: $SERIES_REF does not exist yet; this run starts it"
          else
            echo "quality-series: $SERIES_REF of $remote cannot be read" >&2
            exit 1
          fi
          "$DOCS" series-append --from "$records" --series "$series" --root .
          git -C "$series" add -A
          if [ -z "$(git -C "$series" status --porcelain)" ]; then
            echo "quality-series: the series holds every record of the check run $RUN_ID already"
            echo "appended=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "Append the quality records of the check run $RUN_ID" "" \
            "The records the check run $run wrote for the commit" \
            "$HEAD_SHA on main, each added once under the digest of its bytes." |
            git -C "$series" -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -F -
          if [ -n "$base" ]; then
            git -C "$series" bundle create -q "$bundle" refs/heads/series "^$base"
          else
            git -C "$series" bundle create -q "$bundle" refs/heads/series
          fi
          encoded=$(base64 -w0 "$bundle")
          if [ "${#encoded}" -gt 120000 ]; then
            echo "quality-series: the commit of the run is ${#encoded} bytes in base64, over the 120000 a job output hands on through the environment" >&2
            exit 1
          fi
          {
            echo "appended=true"
            echo "base=$base"
            echo "bundle=$encoded"
          } >> "$GITHUB_OUTPUT"
          echo "quality-series: $(git -C "$series" rev-parse HEAD) on ${base:-no parent} goes to the job push"

  push:
    name: push the commit of append to the series
    needs: append
    if: needs.append.outputs.appended == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Push the commit of the job append to the series
        id: push
        shell: sh
        env:
          TOKEN: ${{ github.token }}
          BASE: ${{ needs.append.outputs.base }}
          BUNDLE: ${{ needs.append.outputs.bundle }}
        run: |
          set -eu
          token=$TOKEN
          unset TOKEN
          basic=$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')
          token=
          echo "::add-mask::$basic"
          remote="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          repo="$RUNNER_TEMP/push"
          bundle="$RUNNER_TEMP/series.bundle"
          changes="$RUNNER_TEMP/series-changes"
          refuse() {
            echo "quality-series: $1; nothing is pushed, and the records of this run reach the series when this workflow run is run again" >&2
            exit 1
          }
          printf '%s' "$BUNDLE" | base64 -d > "$bundle"
          git -c init.defaultBranch=series init -q "$repo"
          found=0
          git -C "$repo" ls-remote --exit-code "$remote" "$SERIES_REF" > "$RUNNER_TEMP/series-head" || found=$?
          if [ "$found" -eq 0 ]; then
            current=$(cut -f1 "$RUNNER_TEMP/series-head")
            git -C "$repo" fetch -q --no-tags "$remote" "$SERIES_REF"
          elif [ "$found" -eq 2 ]; then
            current=
          else
            refuse "$SERIES_REF of $remote cannot be read"
          fi
          if [ "$current" != "$BASE" ]; then
            refuse "$SERIES_REF is at ${current:-nothing}, and the job append appended to ${BASE:-nothing}"
          fi
          git -C "$repo" bundle verify -q "$bundle" > /dev/null
          git -C "$repo" fetch -q "$bundle" refs/heads/series
          commit=$(git -C "$repo" rev-parse FETCH_HEAD)
          parents=$(git -C "$repo" rev-list --parents -n 1 "$commit" | cut -s -d' ' -f2-)
          if [ "$parents" != "$BASE" ]; then
            refuse "the commit $commit of the job append is not one commit on ${BASE:-nothing}"
          fi
          if [ -n "$BASE" ]; then
            git -C "$repo" diff-tree -r --no-commit-id --name-status "$BASE" "$commit" > "$changes"
          else
            git -C "$repo" diff-tree -r --root --no-commit-id --name-status "$commit" > "$changes"
          fi
          if [ ! -s "$changes" ]; then
            refuse "the commit $commit adds no record"
          fi
          if cut -f1 "$changes" | grep -v -x A > /dev/null; then
            refuse "the commit $commit changes or removes a file of the series"
          fi
          if cut -f2 "$changes" | grep -v -x -E '[^/]+/[^/]+/[0-9a-f]{64}[.]evidence[.]json' > /dev/null; then
            refuse "the commit $commit adds a file that is no record of the series"
          fi
          if GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic" \
            git -C "$repo" push "$remote" "$commit:$SERIES_REF"; then
            echo "quality-series: pushed $commit to $SERIES_REF"
          else
            refuse "the forge refused the push of $commit to $SERIES_REF"
          fi
