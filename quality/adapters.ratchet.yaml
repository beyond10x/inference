        - adapters/inference-deepgram/tests/security1_boundaries.rs::a_cancel_during_the_opening_handshake_closes_the_connection_within_the_close_bound
        - adapters/inference-deepgram/tests/agent_duplex.rs::settings_applied_not_arriving_within_the_deadline_fails_the_open_and_closes
        - adapters/inference-deepgram/tests/agent_duplex.rs::a_keepalive_goes_out_after_silence_and_not_while_audio_flows
        - adapters/inference-deepgram/src/config.rs::the_agent_endpoint_takes_a_plain_scheme_and_a_checked_url
        - adapters/inference-deepgram/tests/agent_duplex.rs::dropping_a_session_mid_reply_closes_the_connection_within_the_close_bound
