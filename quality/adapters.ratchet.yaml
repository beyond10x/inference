        - adapters/inference-openai/tests/gpt_live_stall_bound.rs::live_stall_bound_holds_across_dropped_reads
        - adapters/inference-openai/tests/duplex.rs::a_silent_provider_fails_the_session_as_stalled_at_the_bound
