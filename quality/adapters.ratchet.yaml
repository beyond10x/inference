        - adapters/inference-deepslate/tests/opal_duplex.rs::a_ping_goes_out_at_the_interval_and_a_pong_is_no_answer_from_the_model
        - adapters/inference-deepslate/tests/opal_duplex.rs::closing_cancels_the_response_in_progress_and_closes_the_connection
