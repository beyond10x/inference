    target: {kind: build, environments: [local]}
    observation:
      kind: controlled_run
      command: cargo run -p local-voice-cascade --features local --example talk
      runs: 1
      conditions:
        local:
          tools:
            rustc: {pin: rust-toolchain.toml}
    measurements:
      first-audio:
        {kind: sampled, output: duration, boundary: turn_completion_to_first_playable_audio, scope: run, unit: ms, better: lower}
      interruption-stop:
        {kind: sampled, output: duration, boundary: interruption_to_playback_stop, scope: run, unit: ms, better: lower}

  cascade-local-adapters:
    subject: voice-examples
    assessor: printed-duration@1
    target: {kind: build, environments: [local]}
    observation:
      kind: controlled_run
      command: cargo test -p local-voice-cascade --features local --test local_adapters -- --ignored --nocapture
      runs: 1
      conditions:
        local:
          tools:
            rustc: {pin: rust-toolchain.toml}
    measurements:
      first-audio:
        {kind: sampled, output: duration, boundary: turn_completion_to_first_playable_audio, scope: run, unit: ms, better: lower}
      interruption-stop:
        {kind: sampled, output: duration, boundary: interruption_to_playback_stop, scope: run, unit: ms, better: lower}

