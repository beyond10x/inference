format: ratchet/1
project: inference

subjects:
  local-speech-to-text:
    kind: adapter
    audiences: [library-user]
  adapter-crates:
    kind: adapter
    audiences: [library-user, developer]
  voice-examples:
    kind: example
    audiences: [library-user, developer]

assessments:
  sherpa-onnx-stt-resources:
    subject: local-speech-to-text
    assessor: stt-resource-profile@1
    target: {kind: build, environments: [local]}
    observation:
      kind: controlled_run
      command: cargo test --release -p inference-sherpa-onnx --all-features --test stt_resources -- --ignored --nocapture
      runs: 1
      conditions:
        local:
          runner: reference-machine-i9-10900k
          execution: cpu
          threads: "1"
    measurements:
      load-time:
        {kind: sampled, output: load_time, scope: run, unit: ms, better: lower}
      real-time-factor:
        {kind: sampled, output: cpu_real_time_factor, scope: run, unit: thousandths, better: lower}
      peak-memory:
        {kind: sampled, output: peak_resident_memory, scope: run, unit: MiB, better: lower}

  whispercpp-stt-resources:
    subject: local-speech-to-text
    assessor: stt-resource-profile@1
    target: {kind: build, environments: [local]}
    observation:
      kind: controlled_run
      command: cargo test --release -p inference-whispercpp --test stt_resources -- --ignored --nocapture
      runs: 1
      conditions:
        local:
          runner: reference-machine-i9-10900k
          tools: {whisper.cpp: {version: "1.8.3"}}
          execution: cpu
          threads: "4"
    measurements:
      load-time:
        {kind: sampled, output: load_time, scope: run, unit: ms, better: lower}
      real-time-factor:
        {kind: sampled, output: cpu_real_time_factor, scope: run, unit: thousandths, better: lower}
      peak-memory:
        {kind: sampled, output: peak_resident_memory, scope: run, unit: MiB, better: lower}

  sherpa-onnx-stt-record:
    subject: local-speech-to-text
    assessor: capability-record@1
    inputs: {record: adapters/inference-sherpa-onnx/records/stt-i9-10900k-cpu.json}
    target: {kind: document, environments: [local, ci], selection: candidate}
    observation:
      kind: snapshot
      command: task test-run
    measurements:
      real-time-factor:
        {kind: exact, output: cpu_real_time_factor, scope: run, unit: thousandths, better: lower}

  whispercpp-stt-record:
    subject: local-speech-to-text
    assessor: capability-record@1
    inputs: {record: adapters/inference-whispercpp/records/stt-i9-10900k-cpu.json}
    target: {kind: document, environments: [local, ci], selection: candidate}
    observation:
      kind: snapshot
      command: task test-run
    measurements:
      real-time-factor:
        {kind: exact, output: cpu_real_time_factor, scope: run, unit: thousandths, better: lower}

  adapter-tests:
    subject: adapter-crates
    assessor: package-tests@1
    inputs:
      profile: default
      packages:
        - inference-audio-device
        - inference-aws
        - inference-cartesia
        - inference-deepgram
        - inference-deepslate
        - inference-elevenlabs
        - inference-llama-server
        - inference-openai
        - inference-phonic
        - inference-sherpa-onnx
        - inference-whispercpp
    target: {kind: revision, environments: [local, ci], selection: candidate}
    observation:
      kind: controlled_run
      command: task test-run
      runs: 1
      conditions:
        all:
          tools:
            rustc: {pin: rust-toolchain.toml}
            cargo-nextest: {pin: .config/nextest.toml}
    measurements:
      tests-run:
        {kind: exact, output: tests_run, scope: package, unit: tests, better: higher}
      tests-passed:
        {kind: exact, output: tests_passed, scope: package, unit: tests, better: higher}
      slowest-test:
        {kind: sampled, output: slowest_test, scope: package, unit: s, better: lower}

  audio-device-time-bounds:
    subject: adapter-crates
    assessor: named-tests@1
    inputs:
      package: inference-audio-device
      tests:
        - adapters/inference-audio-device/tests/acknowledging.rs::a_speaker_whose_callback_stopped_fails_the_drain_within_the_stated_patience
        - adapters/inference-audio-device/tests/adversary_rf1_acknowledging.rs::a_speaker_that_stops_while_a_frame_waits_for_room_fails_the_drain_within_the_patience
    target: {kind: revision, environments: [local, ci], selection: candidate}
    observation:
      kind: snapshot
      command: task test-run
    measurements:
      held: {kind: exact, output: passed, scope: test}

  aws-time-bounds:
    subject: adapter-crates
    assessor: named-tests@1
    inputs:
      package: inference-aws
      tests:
        - adapters/inference-aws/tests/nova_sonic_stall_and_bounds.rs::the_open_deadline_is_stated
        - adapters/inference-aws/tests/nova_sonic_stall_and_bounds.rs::start_against_a_server_that_never_answers_fails_within_its_deadline
        - adapters/inference-aws/tests/nova_sonic_session.rs::a_silent_service_is_a_stall_after_the_read_timeout
        - adapters/inference-aws/tests/nova_sonic_duplex.rs::a_silent_provider_yields_a_stall_failure_at_the_bound
    target: {kind: revision, environments: [local, ci], selection: candidate}
    observation:
      kind: snapshot
      command: task test-run
    measurements:
      held: {kind: exact, output: passed, scope: test}

  cartesia-time-bounds:
    subject: adapter-crates
    assessor: named-tests@1
    inputs:
      package: inference-cartesia
