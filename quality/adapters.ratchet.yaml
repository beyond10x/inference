        - adapters/inference-elevenlabs/tests/agent_duplex.rs::a_silent_connection_fails_the_session_at_its_read_deadline
        - adapters/inference-elevenlabs/tests/agent_duplex.rs::dropping_a_session_mid_stream_closes_the_connection_within_the_close_bound
