[package]
name = "inference-openai"
description = "OpenAI Realtime and GPT-Live clients for the inference framework: WebSocket sessions with typed client and server events and, with feature speech, a streaming TTS synthesiser over the speech endpoint."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
keychain = ["dep:keyring-core", "dep:secrets-core", "dep:secrets-keychain"]
native-keychain = ["keychain", "secrets-keychain/native-keychain"]
duplex = ["dep:inference-core", "dep:inference-duplex", "dep:inference-tools", "tokio/rt"]
live = ["native-keychain", "duplex"]
gpt-live = []
speech = ["dep:inference-tts", "dep:reqwest", "tokio/rt", "tokio/rt-multi-thread"]

[dependencies]
base64.workspace = true
bytes = "1.9"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
inference-audio = { path = "../../crates/inference-audio" }
inference-core = { path = "../../crates/inference-core", optional = true }
inference-duplex = { path = "../../crates/inference-duplex", optional = true }
inference-tools = { path = "../../crates/inference-tools", optional = true }
inference-tts = { path = "../../crates/inference-tts", optional = true }
keyring-core = { version = "1", optional = true }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
secrets-core = { git = "https://github.com/beyond10x/secrets", tag = "v0.6.0", optional = true }
secrets-keychain = { git = "https://github.com/beyond10x/secrets", tag = "v0.6.0", optional = true }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["net", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
webpki-roots = "0.26"
zeroize = "1"

[dev-dependencies]
inference-testkit = { path = "../../crates/inference-testkit", features = ["tts"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[[test]]
name = "speech_conformance"
required-features = ["speech"]

[[test]]
name = "speech_formats"
required-features = ["speech"]

[[test]]
name = "speech_cancel"
required-features = ["speech"]

[[test]]
name = "speech_request"
required-features = ["speech"]

[[test]]
name = "speech_claims_record"
required-features = ["speech"]

[[test]]
name = "speech_live"
required-features = ["live", "speech"]

[[test]]
name = "live"
required-features = ["live"]

[[test]]
name = "duplex"
required-features = ["duplex"]

[[test]]
name = "live_duplex"
required-features = ["live"]

[[test]]
name = "gpt_live"
required-features = ["gpt-live"]

[[test]]
name = "gpt_live_duplex"
required-features = ["gpt-live", "duplex"]

[[test]]
name = "live_gpt"
required-features = ["live", "gpt-live"]

[[test]]
name = "gpt_live_ping"
required-features = ["gpt-live"]

[[test]]
name = "gpt_live_split"
required-features = ["gpt-live"]

[[test]]
name = "adversary16_u1_live_split"
required-features = ["gpt-live"]

[[test]]
name = "gpt_live_stall_bound"
required-features = ["gpt-live"]

[[test]]
name = "adversary16_u3_live_stall"
required-features = ["gpt-live"]

[[test]]
name = "adversary15_u2_live_ping"
required-features = ["gpt-live"]

[[test]]
name = "adversary15_u3_duplex"
required-features = ["duplex"]

[[test]]
name = "adversary16_u2_tool_descriptions"
required-features = ["gpt-live", "duplex"]

[[test]]
name = "adversary_rf1_speech_transport"
required-features = ["speech"]

[[test]]
name = "adversary_rf1_speech_audio"
required-features = ["speech"]

[lints]
workspace = true

[[test]]
name = "adversary1_usage_openai"
required-features = ["duplex"]
