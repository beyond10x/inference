[package]
name = "inference-elevenlabs"
description = "ElevenLabs for the inference framework: a streaming TTS synthesiser over the multi-stream text-to-speech WebSocket, one connection per utterance, and, with feature duplex, an agent conversation as a native speech model."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
keychain = ["dep:keyring-core", "dep:secrets-core", "dep:secrets-keychain"]
native-keychain = ["keychain", "secrets-keychain/native-keychain"]
duplex = ["dep:inference-duplex", "tokio/macros", "tokio/rt-multi-thread", "tokio/sync"]
live = ["native-keychain"]

[dependencies]
base64.workspace = true
bytes = "1.9"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
inference-duplex = { path = "../../crates/inference-duplex", optional = true }
inference-tts = { path = "../../crates/inference-tts" }
keyring-core = { version = "1", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
secrets-core = { git = "https://github.com/beyond10x/secrets", tag = "v0.6.0", optional = true }
secrets-keychain = { git = "https://github.com/beyond10x/secrets", tag = "v0.6.0", optional = true }
serde_json.workspace = true
tokio = { version = "1", features = ["net", "rt", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
webpki-roots = "0.26"
zeroize = "1"

[dev-dependencies]
inference-testkit = { path = "../../crates/inference-testkit", features = ["tts"] }
serde.workspace = true
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[[test]]
name = "agent_duplex"
required-features = ["duplex"]

[[test]]
name = "agent_duplex_live"
required-features = ["live", "duplex"]

[[example]]
name = "live"
required-features = ["live"]

[lints]
workspace = true
