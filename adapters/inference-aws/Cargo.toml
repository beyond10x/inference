[package]
name = "inference-aws"
description = "Hosted adapter of the inference framework for Amazon Bedrock: an Amazon Nova Sonic speech-to-speech client over the bidirectional stream."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
live = []

[dependencies]
aws-config = { version = "1.12", features = ["behavior-version-latest"] }
aws-sdk-bedrockruntime = { version = "1.148", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-stream = "0.1"
uuid.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
