[package]
name = "inference-deepgram"
description = "Deepgram for the inference framework: a recogniser of the STT contract over the live transcription WebSocket and, with feature duplex, a Voice Agent session as a native speech model."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
keychain = ["dep:keyring-core", "dep:secrets-core", "dep:secrets-keychain"]
native-keychain = ["keychain", "secrets-keychain/native-keychain"]
duplex = ["dep:inference-duplex", "dep:serde", "tokio/rt-multi-thread"]
live = ["native-keychain"]

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
inference-duplex = { path = "../../crates/inference-duplex", optional = true }
inference-stt = { path = "../../crates/inference-stt" }
keyring-core = { version = "1", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
secrets-core = { git = "https://github.com/beyond10x/secrets", tag = "v0.6.0", optional = true }
secrets-keychain = { git = "https://github.com/beyond10x/secrets", tag = "v0.6.0", optional = true }
serde = { workspace = true, optional = true }
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
webpki-roots = "0.26"
zeroize = "1"

[dev-dependencies]
inference-testkit = { path = "../../crates/inference-testkit", features = ["stt"] }
serde.workspace = true
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[[test]]
name = "live"
required-features = ["live"]

[[test]]
name = "agent_duplex"
required-features = ["duplex"]

[[test]]
name = "agent_live"
required-features = ["live", "duplex"]

[lints]
workspace = true
