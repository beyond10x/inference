version: '3'

tasks:
  default:
    cmds:
      - task: check

  check:
    desc: The verified sherpa-onnx native library, specification and planning store validation, the documentation drift check, then format, lint and tests of the workspace.
    cmds:
      - task: sherpa-onnx-archive
      - ess specify validate --path ess
      - aep plan artifact validate
      - task: docs-check
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets --all-features -- -D warnings
      - cargo test --workspace --all-features

  docs-generate:
    desc: Regenerates the derived pages and data of the documentation site under website/.
    cmds:
      - cargo run -q -p inference-docs -- generate

  docs-check:
    desc: Fails when a generated page or data file of the documentation site is missing, stale or edited by hand, or a page fails its checks.
    cmds:
      - cargo run -q -p inference-docs -- generate --check

  sherpa-onnx-archive:
    desc: Fetches the sherpa-onnx native library archive without TTS, checks its pinned sha256 and unpacks it where .cargo/config.toml points SHERPA_ONNX_LIB_DIR.
    vars:
      ARCHIVE: sherpa-onnx-v1.13.8-linux-x64-shared-no-tts-lib
      SHA256: bf2d998c8b07012cd5098f3b92673bc1333fd9b927767d7cb664be8190d8bc0b
      URL: https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-linux-x64-shared-no-tts-lib.tar.bz2
      CACHE: target/sherpa-onnx
    status:
      - echo "{{.SHA256}}  {{.CACHE}}/{{.ARCHIVE}}.tar.bz2" | sha256sum --check --status --strict
      - test -f {{.CACHE}}/{{.ARCHIVE}}/lib/libsherpa-onnx-c-api.so
    cmds:
      - mkdir -p {{.CACHE}}
      - rm -rf {{.CACHE}}/{{.ARCHIVE}} {{.CACHE}}/{{.ARCHIVE}}.tar.bz2 {{.CACHE}}/{{.ARCHIVE}}.tar.bz2.part
      - curl --fail --silent --show-error --location --output {{.CACHE}}/{{.ARCHIVE}}.tar.bz2.part {{.URL}}
      - echo "{{.SHA256}}  {{.CACHE}}/{{.ARCHIVE}}.tar.bz2.part" | sha256sum --check --strict
      - mv {{.CACHE}}/{{.ARCHIVE}}.tar.bz2.part {{.CACHE}}/{{.ARCHIVE}}.tar.bz2
      - tar -xjf {{.CACHE}}/{{.ARCHIVE}}.tar.bz2 -C {{.CACHE}}
