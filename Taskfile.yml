version: '3'

tasks:
  default:
    cmds:
      - task: check

  check:
    desc: The checks of the source, then the build of the tests, then the tests of the workspace, then the quality records of their report, as CI runs them.
    cmds:
      - task: check-source
      - task: test-build
      - task: test-run
      - task: quality-records

  check-source:
    desc: The verified sherpa-onnx native library, specification and planning store validation, the documentation drift check, then format, lint and the documentation build with warnings denied.
    cmds:
      - task: sherpa-onnx-archive
      - ess specify validate --path ess
      - aep plan artifact validate
      - task: docs-check
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets --all-features -- -D warnings
      - RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps

  test-build:
    desc: Builds the tests test-run runs, then makes the fixtures they read with test-fixtures.
    cmds:
      - cargo nextest run --workspace --all-features --no-run
      - cargo nextest run -p inference --no-default-features --test stack --no-run
      - task: test-fixtures

  test-fixtures:
    desc: Synthesizes every conformance suite the tests of inference-testkit read into their cache under target/tmp, side by side, with the one case that reads them all, under the nextest profile setup, so that no test of test-run waits for ess; a suite already kept for the same sources is read, not synthesized again.
    cmds:
      - cargo nextest run -p inference-testkit --all-features --test conformance_suite --profile setup -E 'test(=every_suite_the_tests_read_is_kept)'

  test-run:
    desc: Runs test-run-parts and ends it, as a failure, when it has not finished within 120 s.
    cmds:
      - timeout --kill-after=10s 120s task test-run-parts || { status=$?; if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then echo "task test-run was ended at its bound of 120 s"; fi; exit "$status"; }

  test-run-parts:
    desc: Runs the tests of the workspace with cargo-nextest under .config/nextest.toml, where a test over 60 s is killed and fails, and prints the ten slowest; then the stack test without default features, under the nextest profile stack so that target/nextest/default/junit.xml stays the report of the workspace run, and the doc tests.
    cmds:
      - task: test-workspace
      - cargo nextest run -p inference --no-default-features --test stack --profile stack
      - cargo test --workspace --all-features --doc

  test-workspace:
    desc: Runs the tests of the workspace with cargo-nextest and prints the ten slowest of that run, also when one failed.
    cmds:
      - rm -f target/nextest/default/junit.xml
      - defer: { task: test-slowest }
      - cargo nextest run --workspace --all-features

  test-slowest:
    desc: Prints the ten slowest tests the default nextest profile reported, in seconds, or that no test ran when it left no report.
    cmds:
      - echo "the ten slowest tests, in seconds:"
      - if [ -f target/nextest/default/junit.xml ]; then grep '<testcase ' target/nextest/default/junit.xml | sed -E 's/.* name="([^"]*)" classname="([^"]*)".* time="([^"]*)".*/\3 \2 \1/' | sort -rn | head -n 10; else echo "no test ran"; fi

  quality-records:
    desc: Writes the record of each assessment that inference-docs junit-assessments lists from the plan files, with inference-docs assess from the report test-run kept at target/nextest/default/junit.xml, to target/quality-records/<plan>/<assessment>.evidence.json; fails and names every assessment whose record was refused. The source is the forge run when GITHUB_SERVER_URL, GITHUB_REPOSITORY and GITHUB_RUN_ID are set, else the report.
    cmds:
      - rm -rf target/quality-records target/quality-records.list
      - mkdir -p target/quality-records
      - cargo run -q -p inference-docs -- junit-assessments > target/quality-records.list
      - |
        report=target/nextest/default/junit.xml
        revision=$(git rev-parse HEAD)
        if [ -n "${GITHUB_SERVER_URL:-}" ] && [ -n "${GITHUB_REPOSITORY:-}" ] && [ -n "${GITHUB_RUN_ID:-}" ]; then
          class=ci
          source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        else
          class=local
          source=$report
        fi
        written=0
        refused=""
        while read -r plan assessment kind; do
          out="target/quality-records/$plan/$assessment.evidence.json"
          mkdir -p "target/quality-records/$plan"
          set -- --project inference --assessment "$assessment" --root . --class "$class" --out "$out" --from "$report" --source "$source"
          if [ "$kind" = revision ]; then
            set -- "$@" --revision "$revision"
          fi
          if cargo run -q -p inference-docs -- assess "$@" < /dev/null; then
            echo "$out: written"
            written=$((written + 1))
          else
            refused="$refused $assessment"
          fi
        done < target/quality-records.list
        if [ -n "$refused" ]; then
          echo "task quality-records: no record of$refused" >&2
          exit 1
        fi
        if [ "$written" -eq 0 ]; then
          echo "task quality-records: inference-docs junit-assessments listed no assessment" >&2
          exit 1
        fi

  quality-adopt:
    desc: Adopts the records of the check run RUN on main into quality/records/ with inference-docs adopt-records, from the directory DIR its artifact quality-records-<commit> was downloaded to and the file RUN_JSON where the output of gh run view RUN --json databaseId,headBranch,headSha,event,workflowName was saved; downloads nothing, and writes all records or none.
    requires:
      vars: [RUN, DIR, RUN_JSON]
    cmds:
      - cargo run -q -p inference-docs -- adopt-records --run "{{.RUN}}" --run-json "{{.RUN_JSON}}" --from "{{.DIR}}" --root .

  quality-live:
    desc: The keyed live measures of OpenAI and ElevenLabs on this machine, outside check and every workflow, with inference-docs live. Prints the hosted calls of one run per provider and, without YES=1, calls nothing and exits 2. With YES=1, given only after the owner's yes to that count, it reads each key from the Secret Service into its commands' environment only and writes each record with inference-docs assess --class local to .ratchet/records/<plan>/<assessment>/<run id>.evidence.json, which git ignores.
    env:
      YES: '{{.YES}}'
    cmds:
      - cargo build -q -p inference-docs
      - target/debug/inference-docs live --root .

  test-slow:
    desc: The slow lane, every trybuild case of the inference crate in one trybuild run, under the slow nextest profile; runs again only when one of its sources changed.
    sources:
      - crates/inference-macros/**/*
      - crates/inference/src/**/*
      - crates/inference-tools/src/**/*
      - crates/inference/tests/ui.rs
      - crates/inference/tests/ui/**/*
      - crates/inference/tests/compile_fail/**/*
      - Cargo.lock
      - rust-toolchain.toml
      - .config/nextest.toml
    cmds:
      - cargo nextest run -p inference --features audio-device --profile slow

  docs-generate:
    desc: Regenerates the derived pages and data of the documentation site under website/.
    cmds:
      - cargo run -q -p inference-docs -- generate

  docs-check:
    desc: Fails when a generated page or data file of the documentation site is missing, stale or edited by hand, or a page fails its checks.
    cmds:
      - cargo run -q -p inference-docs -- generate --check

  sherpa-onnx-archive:
    desc: Fetches the sherpa-onnx native library archive without TTS, checks its pinned sha256 and unpacks it where .cargo/config.toml points SHERPA_ONNX_LIB_DIR.
    vars:
      ARCHIVE: sherpa-onnx-v1.13.8-linux-x64-shared-no-tts-lib
      SHA256: bf2d998c8b07012cd5098f3b92673bc1333fd9b927767d7cb664be8190d8bc0b
      URL: https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-linux-x64-shared-no-tts-lib.tar.bz2
      CACHE: target/sherpa-onnx
    status:
      - echo "{{.SHA256}}  {{.CACHE}}/{{.ARCHIVE}}.tar.bz2" | sha256sum --check --status --strict
      - test -f {{.CACHE}}/{{.ARCHIVE}}/lib/libsherpa-onnx-c-api.so
    cmds:
      - mkdir -p {{.CACHE}}
      - rm -rf {{.CACHE}}/{{.ARCHIVE}} {{.CACHE}}/{{.ARCHIVE}}.tar.bz2 {{.CACHE}}/{{.ARCHIVE}}.tar.bz2.part
      - curl --fail --silent --show-error --location --output {{.CACHE}}/{{.ARCHIVE}}.tar.bz2.part {{.URL}}
      - echo "{{.SHA256}}  {{.CACHE}}/{{.ARCHIVE}}.tar.bz2.part" | sha256sum --check --strict
      - mv {{.CACHE}}/{{.ARCHIVE}}.tar.bz2.part {{.CACHE}}/{{.ARCHIVE}}.tar.bz2
      - tar -xjf {{.CACHE}}/{{.ARCHIVE}}.tar.bz2 -C {{.CACHE}}
