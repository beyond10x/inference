version: '3'

tasks:
  default:
    cmds:
      - task: check

  check:
    desc: Specification and planning store validation, then format, lint and tests of the workspace.
    cmds:
      - ess specify validate --path ess
      - aep plan artifact validate
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets -- -D warnings
      - cargo test --workspace
