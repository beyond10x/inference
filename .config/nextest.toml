nextest-version = { required = "0.9.143" }

[profile.default]
default-filter = "not (package(inference) & binary(ui))"
test-threads = 8
slow-timeout = { period = "60s", terminate-after = 1 }
final-status-level = "slow"
fail-fast = false

[profile.default.junit]
path = "junit.xml"

[profile.stack]
slow-timeout = { period = "60s", terminate-after = 1 }
final-status-level = "slow"
fail-fast = false

[profile.setup]
slow-timeout = { period = "60s", terminate-after = 1 }
final-status-level = "slow"
fail-fast = false

[profile.slow]
default-filter = "package(inference) & binary(ui)"
slow-timeout = { period = "60s", terminate-after = 10 }
final-status-level = "slow"
fail-fast = false

[profile.slow.junit]
path = "junit.xml"
