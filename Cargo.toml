[workspace]
resolver = "3"
members = ["crates/*", "examples/*", "adapters/*"]

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/inference"

[workspace.dependencies]
base64 = "0.23"
llm-core = { package = "b10x-llm-core", git = "https://github.com/beyond10x/llm", tag = "0.8.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
