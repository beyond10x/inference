[package]
name = "realtime-voice"
description = "Example: a spoken conversation with a native speech model, microphone in and speaker out, with barge-in and one demo tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
local = ["dep:inference-llama-server", "local-voice-cascade/local"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
inference-audio-device = { path = "../../adapters/inference-audio-device", default-features = false }
inference-duplex = { path = "../../crates/inference-duplex" }
inference-elevenlabs = { path = "../../adapters/inference-elevenlabs", features = ["stt"] }
inference-llama-server = { path = "../../adapters/inference-llama-server", optional = true }
inference-llm = { path = "../../crates/inference-llm" }
inference-stt = { path = "../../crates/inference-stt" }
inference-tts = { path = "../../crates/inference-tts" }
local-voice-cascade = { path = "../local-voice-cascade" }
serde_json.workspace = true

[dev-dependencies]
clap = { version = "4", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
inference-audio-device = { path = "../../adapters/inference-audio-device" }
inference-aws = { path = "../../adapters/inference-aws", features = ["duplex"] }
inference-cartesia = { path = "../../adapters/inference-cartesia" }
inference-deepgram = { path = "../../adapters/inference-deepgram", features = ["duplex"] }
inference-deepslate = { path = "../../adapters/inference-deepslate" }
inference-elevenlabs = { path = "../../adapters/inference-elevenlabs", features = ["duplex", "native-keychain", "stt"] }
inference-openai = { path = "../../adapters/inference-openai", features = ["gpt-live", "live"] }
inference-phonic = { path = "../../adapters/inference-phonic" }
inference-testkit = { path = "../../crates/inference-testkit", features = ["duplex", "llm", "stt", "tts"] }

[lints]
workspace = true
