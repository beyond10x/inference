type: ess-scenario/1
domain: inference.duplex
scenario: close-delivers-received-usage
summary: Every event still held at the close, usage among them, is delivered before SpeechSessionClosed; one already delivered stays as it was; nothing sent after the close is received.
arrange:
  - instance: model
    entity: inference.model.Model
  - instance: adapter
    entity: inference.model.Adapter
  - instance: session
    entity: inference.duplex.SpeechSession
  - instance: transcript
    entity: inference.duplex.ReceivedSessionEvent
  - instance: answer
    entity: inference.duplex.ReceivedSessionEvent
  - instance: usage
    entity: inference.duplex.ReceivedSessionEvent
timeline:
  - at: 2026-01-05T09:00:00Z
    command: inference.model.DeclareModel
    input:
      family: speech
      checkpoint: hosted
      code_license: none
      weight_license: none
      checksum: none
      input_modalities: [Audio]
      output_modalities: [Audio, Text]
      provenance: hosted endpoint
      source_revision: r1
    outcome: declared
    capture: {instance: model, event: inference.model.ModelDeclared, field: model_id}
  - at: 2026-01-05T09:00:01Z
    command: inference.model.DeclareAdapter
    input:
      model_id: {$instance: model}
      backend: realtime
      contract_revision: r1
      execution_form: hosted_service
      locality: external_provider
      capabilities: [output_streaming, incremental_input, concurrent_input_output, interruptible]
      max_concurrency: 1
    outcome: declared
    capture: {instance: adapter, event: inference.model.AdapterDeclared, field: adapter_id}
  - at: 2026-01-05T09:00:02Z
    command: inference.duplex.OpenSpeechSession
    input:
      adapter_id: {$instance: adapter}
      voice: calm
      instructions: answer briefly
      input_format: {encoding: pcm_s16le, sample_rate: 16000, channels: 1}
      output_format: {encoding: pcm_s16le, sample_rate: 16000, channels: 1}
      turn_detection: server_vad
      auto_response: true
      auto_interrupt: false
      tools: []
      idle_limit_ms: 15000
    outcome: opened
    capture: {instance: session, event: inference.duplex.SpeechSessionOpened, field: session_id}
  - at: 2026-01-05T09:00:03Z
    command: inference.duplex.ReceiveSessionEvent
    input: {session_id: {$instance: session}, kind: input_transcript, sequence: 1}
    outcome: received
    capture: {instance: transcript, event: inference.duplex.SessionEventReceived, field: received_id}
  - at: 2026-01-05T09:00:04Z
    command: inference.duplex.DeliverSessionEvent
    input: {received_id: {$instance: transcript}}
    outcome: delivered
  - at: 2026-01-05T09:00:05Z
    command: inference.duplex.ReceiveSessionEvent
    input: {session_id: {$instance: session}, kind: output_transcript, sequence: 2}
    outcome: received
    capture: {instance: answer, event: inference.duplex.SessionEventReceived, field: received_id}
  - at: 2026-01-05T09:00:06Z
    command: inference.duplex.ReceiveSessionEvent
    input: {session_id: {$instance: session}, kind: usage, sequence: 3}
    outcome: received
    capture: {instance: usage, event: inference.duplex.SessionEventReceived, field: received_id}
  - at: 2026-01-05T09:00:07Z
    command: inference.duplex.CloseSpeechSession
    input: {session_id: {$instance: session}}
    outcome: closed
    events:
      - event: inference.duplex.SpeechSessionClosed
        payload: {session_id: {$instance: session}}
  - at: 2026-01-05T09:00:08Z
    command: inference.duplex.ReceiveSessionEvent
    input: {session_id: {$instance: session}, kind: usage, sequence: 4}
    outcome: session-not-open
assert:
  - view: inference.duplex.ReceivedSessionEvents
    contains:
      received_id: {$instance: answer}
      session_id: {$instance: session}
      kind: output_transcript
      sequence: 2
      delivered_before: closed
      state: Delivered
  - view: inference.duplex.ReceivedSessionEvents
    contains:
      received_id: {$instance: usage}
      session_id: {$instance: session}
      kind: usage
      sequence: 3
      delivered_before: closed
      state: Delivered
  - view: inference.duplex.ReceivedSessionEvents
    contains:
      received_id: {$instance: transcript}
      session_id: {$instance: session}
      kind: input_transcript
      sequence: 1
      delivered_before: null
      state: Delivered
  - view: inference.duplex.ReceivedSessionEvents
    counts: {at_least: 3, at_most: 3}
  - view: inference.duplex.SpeechSessions
    contains: {session_id: {$instance: session}, state: Closed}
