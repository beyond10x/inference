format: ess/25
system: inference
version: v1

summary: >-
  The nouns of the inference design (docs/design/inference.md, v0.2) and their relations: the
  models and adapters that can compute, the typed graph of nodes, ports and edges a pipeline
  declares and the run that executes it, the provisional and committed spans and segments that
  stream through it, the tool calls a generation proposes, the session an application opens above
  runs, and the deployment profile that admits compute and egress. Every declaration cites the
  design line it was read from; no code exists yet, and a relation the design does not settle
  carries an UNMAPPED marker instead of a guess.

# UNMAPPED: no domain declares the STT, LLM and TTS contracts (design 355-389), though stage P0
# delivers them (1158); inference.audio declares the audio vocabulary they share (293). Their
# nouns (transcripts, synthesis, voices) are the contract stories' to declare. Open question for
# the owner.
# UNMAPPED: no event carries the canonical envelope (schema_version, event_id, run_id,
# session_id, stream_id, sequence, producer and port, timestamp, causation_id; design 303-318,
# a SHOULD), and the version a public event schema MUST carry across a process or network
# boundary (278). Whether the envelope is a shared struct on every event or a transport wrapper
# is not settled. Open question for the owner.
domains:
  - inference.model
  - inference.policy
  - inference.graph
  - inference.stream
  - inference.tools
  - inference.session
  - inference.audio
  - inference.duplex
  - inference.usage
  - inference.sdk
