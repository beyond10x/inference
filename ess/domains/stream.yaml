# The streaming semantics of docs/design/inference.md §11: provisional, committed and
# irreversible are three classes, and this domain is their state machine. Inbound text moves from
# hypothesis to committed span inside a turn; outbound text moves from tentative delta to
# committed segment to queued to synthesized to played, and played audio cannot be unsaid; a
# generation is the epoch an interruption supersedes.
domain: inference.stream

summary: >-
  A Turn is the control boundary of one input turn, distinct from the commit of its Spans. A Span
  is inbound text that is a Hypothesis until it is Committed; a revision changes a hypothesis and
  is refused on a committed span. A Generation is one model output epoch within a run; an
  interruption supersedes it, and a stale generation admits no new output. An OutputSegment is
  outbound text that is Tentative until Committed, then Queued for synthesis, then Synthesized,
  then Played once the sink acknowledges it; synthesis normally consumes committed segments, and
  the speculative lower-integrity mode is not declared, so a Tentative segment is refused.
  Superseding or cancelling a generation discards its unplayed segments, and a played segment is
  never discarded.

naming:
  wire: stream
  display: Stream

types:
  - name: inference.stream.TurnId
    kind: newtype
    of: Uuid

  - name: inference.stream.SpanId
    kind: newtype
    of: Uuid

  # UNMAPPED: the design gives stream_id only as an envelope field, "independently ordered stream
  # identity" (docs/design/inference.md:311). Whether a stream is an entity of its own (with a
  # producer and port, docs/design/inference.md:313) or only a key is not settled; no entity owns
  # it here. Open question for the owner.
  - name: inference.stream.StreamId
    kind: newtype
    of: Uuid

  - name: inference.stream.GenerationId
    kind: newtype
    of: Uuid

  - name: inference.stream.SegmentId
    kind: newtype
    of: Uuid

entities:
  # Turn completion is a control boundary declaring a whole input turn complete, distinct from
  # the commit of individual spans.
  # read from: docs/design/inference.md:606
  - name: inference.stream.Turn
    naming:
      summary: One input turn; its completion is a control boundary, not a commit.
    identity:
      name: turn_id
      type: inference.stream.TurnId
    fields:
      - name: run_id
        type: inference.graph.RunId
    relations:
      - name: run
        kind: references
        target: inference.graph.Run
        cardinality: one
        via: run_id
    lifecycle:
      initial: Open
      states: [Open, Completed]
      terminal: [Completed]
      transitions:
        - name: complete
          from: [Open]
          to: Completed

  # Inbound text: a hypothesis is subject to later replacement, a revision is an explicit change
  # to an identified provisional span, a committed span is an immutable unit downstream nodes may
  # treat as stable. A stable prefix may be committed before the utterance is complete.
  # read from: docs/design/inference.md:603-605
  # read from: docs/design/inference.md:608
  - name: inference.stream.Span
    naming:
      summary: A unit of inbound text, provisional until committed and immutable after.
    identity:
      name: span_id
      type: inference.stream.SpanId
    fields:
      - name: run_id
        type: inference.graph.RunId
      - name: turn_id
        type: inference.stream.TurnId
      - name: stream_id
        type: inference.stream.StreamId
      - name: sequence
        type: Integer
      - name: text
        type: String
    relations:
      - name: run
        kind: references
        target: inference.graph.Run
        cardinality: one
        via: run_id
      # Turn completion is distinct from the commit of individual spans; the turn is the boundary
      # a span arrived in.
      # read from: docs/design/inference.md:606
      # UNMAPPED: whether the turn owns its spans or only references them is a spec choice, not
      # read from the design: `references` is kept so a committed span is not deleted with its
      # turn. Open question for the owner.
      - name: turn
        kind: references
        target: inference.stream.Turn
        cardinality: one
        via: turn_id
    lifecycle:
      initial: Hypothesis
      states: [Hypothesis, Committed]
      terminal: [Committed]
      transitions:
        - name: commit
          from: [Hypothesis]
          to: Committed

  # One generation epoch of a producing node within a run. On interruption the current epoch is
  # marked superseded and stale results from it are rejected at irreversible sinks.
  # read from: docs/design/inference.md:315
  # read from: docs/design/inference.md:634
  # read from: docs/design/inference.md:637
  - name: inference.stream.Generation
    naming:
      summary: One output epoch of a node within a run; an interruption supersedes it.
    identity:
      name: generation_id
      type: inference.stream.GenerationId
    fields:
      - name: run_id
        type: inference.graph.RunId
      - name: node_id
        type: inference.graph.NodeId
      - name: epoch
        type: Integer
    relations:
      - name: run
        kind: references
        target: inference.graph.Run
        cardinality: one
        via: run_id
      # UNMAPPED: the generation references the declared Node. The design speaks of "affected
      # node instances" on cancellation (docs/design/inference.md:636), and a NodeInstance is the
      # node in one run; whether a generation belongs to the NodeInstance (run_id, node_id) instead
      # is not settled. Open question for the owner.
      - name: producer
        kind: references
        target: inference.graph.Node
        cardinality: one
        via: node_id
      # A segment has no meaning outside the generation that produced it; cancellation of the
      # generation discards its unplayed segments.
      # read from: docs/design/inference.md:628
      - name: segments
        kind: owns
        target: inference.stream.OutputSegment
        cardinality: many
        via: generation_id
    lifecycle:
      initial: Active
      states: [Active, Completed, Superseded, Cancelled]
      terminal: [Completed, Superseded, Cancelled]
      transitions:
        - name: complete
          from: [Active]
          to: Completed
        - name: supersede
          from: [Active]
          to: Superseded
        - name: cancel
          from: [Active]
          to: Cancelled

  # Outbound text: generated or tentative, committed, queued for synthesis, synthesized but not
  # yet played, played and confirmed by a sink acknowledgement. Speech already played is
  # irreversible; synthesized audio not yet played is still discarded on cancellation.
  # UNMAPPED: whether playback of a segment may start before its synthesis completes (TTS that
  # emits audio incrementally, docs/design/inference.md:386) is not settled; this lifecycle plays
  # a segment only from Synthesized. Open question for the owner.
  # read from: docs/design/inference.md:614-618
  # read from: docs/design/inference.md:388
  # read from: docs/design/inference.md:620
  - name: inference.stream.OutputSegment
    naming:
      summary: A unit of outbound text from tentative delta to played audio.
    identity:
      name: segment_id
      type: inference.stream.SegmentId
    fields:
      - name: generation_id
        type: inference.stream.GenerationId
      # The run of the segment's generation, copied from the generation when the segment is
      # created, so a run's cancellation can discard its unplayed segments.
      # read from: docs/design/inference.md:628
      # read from: docs/design/inference.md:1128
      - name: run_id
        type: inference.graph.RunId
      - name: sequence
        type: Integer
      - name: text
        type: String
    relations:
      - name: run
        kind: references
        target: inference.graph.Run
        cardinality: one
        via: run_id
    lifecycle:
      initial: Tentative
      states: [Tentative, Committed, Queued, Synthesized, Played, Discarded]
      terminal: [Played, Discarded]
      transitions:
        - name: commit
          from: [Tentative]
          to: Committed
        - name: queue
          from: [Committed]
          to: Queued
        - name: synthesize
          from: [Queued]
          to: Synthesized
        - name: play
          from: [Synthesized]
          to: Played
        - name: discard
          from: [Tentative, Committed, Queued, Synthesized]
          to: Discarded

errors:
  - name: inference.stream.TurnStateConflict
    summary: The turn is not Open, so nothing moved.
    fields:
      - name: current
        type: inference.stream.Turn.State

  # read from: docs/design/inference.md:1105
  - name: inference.stream.CommittedSpanImmutable
    summary: A revision cannot rewrite a committed span.
    fields:
      - name: span_id
        type: inference.stream.SpanId

  - name: inference.stream.SpanNotFound
    summary: No span carries the identity the command named.
    fields:
      - name: span_id
        type: inference.stream.SpanId

  - name: inference.stream.SpanStateConflict
    summary: The span is not a Hypothesis, so nothing moved.
    fields:
      - name: current
        type: inference.stream.Span.State

  - name: inference.stream.GenerationStateConflict
    summary: The generation is not Active, so nothing moved.
    fields:
      - name: current
        type: inference.stream.Generation.State

  - name: inference.stream.SegmentStateConflict
    summary: The segment is not in a state this command acts from; a played segment cannot be unsaid, a tentative one cannot be spoken.
    fields:
      - name: current
        type: inference.stream.OutputSegment.State

  # An identity a command names that no turn or generation holds is refused, not accepted as a
  # dangling reference. One not-found error per noun, declared in the domain that owns the noun:
  # an unknown run or node answers with the graph domain's RunNotFound or NodeNotFound.
  # read from: docs/design/inference.md:525
  # read from: docs/design/inference.md:1110
  - name: inference.stream.TurnNotFound
    summary: No turn carries the identity the command named.
    fields:
      - name: turn_id
        type: inference.stream.TurnId

  # read from: docs/design/inference.md:525
  # read from: docs/design/inference.md:1110
  - name: inference.stream.GenerationNotFound
    summary: No generation carries the identity the command named.
    fields:
      - name: generation_id
        type: inference.stream.GenerationId

actors:
  # Only the client or media sink can confirm playback; it is the one actor granted the
  # acknowledgement. No other actor is declared yet.
  # read from: docs/design/inference.md:388
  # read from: docs/design/inference.md:699
  - name: inference.stream.MediaSink
    naming:
      summary: The client or media sink that plays audio and confirms what the user heard.
    may:
      - inference.stream.AcknowledgePlayback

commands:
  # A turn is input to a running pipeline: a run that is not Active (not yet started, draining
  # or terminal) admits no new turn, as DrainRun's "no new input is admitted" says.
  # read from: docs/design/inference.md:651
  # read from: docs/design/inference.md:671
  - name: inference.stream.OpenTurn
    input:
      - name: run_id
        type: inference.graph.RunId
    outcomes:
      - name: unknown-run
        when_related: {via: input.run_id, exists: false}
        error: inference.graph.RunNotFound
        payload:
          inference.graph.RunNotFound:
            run_id: input.run_id
        summary: No run carries this identity; no turn was opened.
      # RunStateConflict.current has no payload source: ess reads a related row's fields, not its
      # held state, as a value.
      - name: run-not-active
        when_related: {via: input.run_id, predicate: state != Active}
        error: inference.graph.RunStateConflict
        summary: The run is not Active; no turn was opened.
      - name: opened
        creates: inference.stream.Turn
        instance: turn_id
        sets:
          run_id: input.run_id
        emits:
          - inference.stream.TurnOpened
        payload:
          inference.stream.TurnOpened:
            turn_id: {generated: true}
            run_id: input.run_id
        summary: An input turn is open and spans may arrive in it.

  # read from: docs/design/inference.md:606
  - name: inference.stream.CompleteTurn
    input:
      - name: turn_id
        type: inference.stream.TurnId
    outcomes:
      - name: completed
        moves: inference.stream.Turn.complete
        instance: turn_id
        emits:
          - inference.stream.TurnCompleted
        payload:
          inference.stream.TurnCompleted:
            turn_id: input.turn_id
        summary: The whole input turn is declared complete.
      - name: wrong-state
        wrong_state: true
        error: inference.stream.TurnStateConflict
        payload:
          inference.stream.TurnStateConflict:
            current: {subject: state}

  # read from: docs/design/inference.md:603
  # read from: docs/design/inference.md:334
  - name: inference.stream.EmitHypothesis
    input:
      - name: run_id
        type: inference.graph.RunId
      - name: turn_id
        type: inference.stream.TurnId
      - name: stream_id
        type: inference.stream.StreamId
      - name: sequence
        type: Integer
      - name: text
        type: String
    outcomes:
      # read from: docs/design/inference.md:651
      # read from: docs/design/inference.md:671
      - name: unknown-run
        when_related: {via: input.run_id, exists: false}
        error: inference.graph.RunNotFound
        payload:
          inference.graph.RunNotFound:
            run_id: input.run_id
        summary: No run carries this identity; no span was created.
      - name: run-not-active
        when_related: {via: input.run_id, predicate: state != Active}
        error: inference.graph.RunStateConflict
        summary: The run is not Active; no span was created.
      - name: unknown-turn
        when_related: {via: input.turn_id, exists: false}
        error: inference.stream.TurnNotFound
        payload:
          inference.stream.TurnNotFound:
            turn_id: input.turn_id
        summary: No turn carries this identity; no span was created.
      # UNMAPPED: span.run_id is not tied to its turn's run_id. A `turn-of-other-run` refusal
      # (`when_related: {via: input.turn_id, predicate: run_id != input.run_id}`) validates, but
      # beside the run guards ess 0.60.0 synthesis then finds no arrangement for this command
      # (ESS-SYNTH-003). Open: derive run_id from the turn, or wait for synthesis.
      # Turn completion is the control boundary declaring the whole input turn complete: a
      # completed turn admits no further span. TurnStateConflict.current has no payload source:
      # ess reads a related row's fields, not its held state, as a value.
      # read from: docs/design/inference.md:606
      - name: turn-not-open
        when_related: {via: input.turn_id, predicate: state != Open}
        error: inference.stream.TurnStateConflict
        summary: The turn is Completed; no span was created.
      # UNMAPPED: a duplicate or decreasing sequence on one stream_id is not refused, though
      # per-stream sequence constraints are to be enforced (docs/design/inference.md:312,
      # docs/design/inference.md:1110). The refusal is a row-set guard over Spans (`stream_id ==
      # input.stream_id`, `sequence >= input.sequence`), and ess 0.60.0 refuses a row-set guard beside
      # this command's identity-addressed run and turn guards (ESS-COMMAND-009). Whether the scope
      # is per stream or per producer and stream is also open.
      - name: emitted
        creates: inference.stream.Span
        instance: span_id
        sets:
          run_id: input.run_id
          turn_id: input.turn_id
          stream_id: input.stream_id
          sequence: input.sequence
          text: input.text
        emits:
          - inference.stream.TranscriptHypothesis
        payload:
          inference.stream.TranscriptHypothesis:
            span_id: {generated: true}
            turn_id: input.turn_id
            sequence: input.sequence
            text: input.text
        summary: A provisional span exists; downstream may speculate on it, side effects may not.

  # A revision is an explicit change to an identified provisional span; a committed span is
  # immutable, and a revision of one is the first contract test of the design.
  # read from: docs/design/inference.md:604
  # read from: docs/design/inference.md:1105
  - name: inference.stream.ReviseSpan
    input:
      - name: span_id
        type: inference.stream.SpanId
      - name: text
        type: String
    outcomes:
      - name: revised
        when_subject_state: Hypothesis
        updates: inference.stream.Span
        instance: span_id
        sets:
          text: input.text
        emits:
          - inference.stream.TranscriptRevision
        payload:
          inference.stream.TranscriptRevision:
            span_id: input.span_id
            text: input.text
        summary: The hypothesis now reads the revised text.
      - name: immutable
        error: inference.stream.CommittedSpanImmutable
        payload:
          inference.stream.CommittedSpanImmutable:
            span_id: input.span_id
        summary: The span is Committed; the revision is refused and the text is unchanged.
      - name: no-such-span
        unknown_instance: true
        error: inference.stream.SpanNotFound
        payload:
          inference.stream.SpanNotFound:
            span_id: input.span_id
        summary: No span carries this identity; nothing was revised.

  # read from: docs/design/inference.md:605
  - name: inference.stream.CommitSpan
    input:
      - name: span_id
        type: inference.stream.SpanId
    outcomes:
      - name: committed
        moves: inference.stream.Span.commit
        instance: span_id
        emits:
          - inference.stream.TranscriptCommitted
        payload:
          inference.stream.TranscriptCommitted:
            span_id: input.span_id
            text: {subject: text}
        summary: The span is immutable and safe for side-effecting consumers.
      - name: wrong-state
        wrong_state: true
        error: inference.stream.SpanStateConflict
        payload:
          inference.stream.SpanStateConflict:
            current: {subject: state}

  # read from: docs/design/inference.md:335
  - name: inference.stream.StartGeneration
    input:
      - name: run_id
        type: inference.graph.RunId
      - name: node_id
        type: inference.graph.NodeId
      - name: epoch
        type: Integer
    outcomes:
      # read from: docs/design/inference.md:651
      # read from: docs/design/inference.md:671
      - name: unknown-run
        when_related: {via: input.run_id, exists: false}
        error: inference.graph.RunNotFound
        payload:
          inference.graph.RunNotFound:
            run_id: input.run_id
        summary: No run carries this identity; no generation was started.
      - name: run-not-active
        when_related: {via: input.run_id, predicate: state != Active}
        error: inference.graph.RunStateConflict
        summary: The run is not Active; no generation was started.
      - name: unknown-node
        when_related: {via: input.node_id, exists: false}
        error: inference.graph.NodeNotFound
        payload:
          inference.graph.NodeNotFound:
            node_id: input.node_id
        summary: No node carries this identity; no generation was started.
      # UNMAPPED: a second Active generation for one (run_id, node_id), and an epoch not above the
      # node's last, are not refused. The design has one current epoch per node that an
      # interruption supersedes (docs/design/inference.md:634) and asks that a new generation mark
      # a change of epoch (docs/design/inference.md:1008). Both refusals are row-set guards over
      # Generations, which ess 0.60.0 refuses beside the identity-addressed run and node guards
      # (ESS-COMMAND-009).
      - name: started
        creates: inference.stream.Generation
        instance: generation_id
        sets:
          run_id: input.run_id
          node_id: input.node_id
          epoch: input.epoch
        emits:
          - inference.stream.GenerationStarted
        payload:
          inference.stream.GenerationStarted:
            generation_id: {generated: true}
            run_id: input.run_id
            epoch: input.epoch
        summary: A new output epoch is active for the node.

  - name: inference.stream.CompleteGeneration
    input:
      - name: generation_id
        type: inference.stream.GenerationId
    outcomes:
      - name: completed
        moves: inference.stream.Generation.complete
        instance: generation_id
        emits:
          - inference.stream.GenerationCompleted
        payload:
          inference.stream.GenerationCompleted:
            generation_id: input.generation_id
        summary: The generation produced its last output.
      - name: wrong-state
        wrong_state: true
        error: inference.stream.GenerationStateConflict
        payload:
          inference.stream.GenerationStateConflict:
            current: {subject: state}

  # Interruption step 1: mark the current generation epoch as superseded. Step 2 is the same
  # outcome: every unplayed segment of the epoch is discarded; a Played one is outside the discard
  # transition's source states, so the selected move skips it. Step 4 follows: a discarded segment
  # refuses commit, queueing and playback as a wrong state.
  # UNMAPPED: interruption is not one command. Steps 1, 2 and 4 are this outcome; step 3 (signal
  # cancellation to affected node instances) needs a NodeInstance lifecycle the graph domain does
  # not declare yet, step 5 (tool audit and reconciliation) belongs to the tools domain, and step 6
  # (admit new input by turn or duplex policy) has no policy noun (docs/design/inference.md:636,
  # docs/design/inference.md:638-639). Open question for the owner.
  # read from: docs/design/inference.md:634
  # read from: docs/design/inference.md:635
  # read from: docs/design/inference.md:637
  # read from: docs/design/inference.md:628
  - name: inference.stream.SupersedeGeneration
    input:
      - name: generation_id
        type: inference.stream.GenerationId
    outcomes:
      - name: superseded
        moves: inference.stream.Generation.supersede
        instance: generation_id
        emits:
          - inference.stream.GenerationSuperseded
        payload:
          inference.stream.GenerationSuperseded:
            generation_id: input.generation_id
        affects:
          - entity: inference.stream.OutputSegment
            where: generation_id == input.generation_id
            moves: inference.stream.OutputSegment.discard
        summary: Stale results from this epoch are rejected at irreversible sinks; its unplayed segments are discarded.
      - name: wrong-state
        wrong_state: true
        error: inference.stream.GenerationStateConflict
        payload:
          inference.stream.GenerationStateConflict:
            current: {subject: state}

  # Cancellation of delivery: the generation's unplayed segments are discarded with it; a Played
  # one is outside the discard transition's source states, so the selected move skips it.
  # read from: docs/design/inference.md:641
  # read from: docs/design/inference.md:628
  # read from: docs/design/inference.md:620
  - name: inference.stream.CancelGeneration
    input:
      - name: generation_id
        type: inference.stream.GenerationId
    outcomes:
      - name: cancelled
        moves: inference.stream.Generation.cancel
        instance: generation_id
        emits:
          - inference.stream.GenerationCancelled
        payload:
          inference.stream.GenerationCancelled:
            generation_id: input.generation_id
        affects:
          - entity: inference.stream.OutputSegment
            where: generation_id == input.generation_id
            moves: inference.stream.OutputSegment.discard
        summary: Delivery from this generation is cancelled and its unplayed segments are discarded; computation may still finish.
      - name: wrong-state
        wrong_state: true
        error: inference.stream.GenerationStateConflict
        payload:
          inference.stream.GenerationStateConflict:
            current: {subject: state}

  # A delta enters only an Active generation: a Completed one has produced its last output, and
  # output from a Superseded or Cancelled one is stale and suppressed. With the discard on
  # supersede and cancel, no segment of a stale generation can then be committed, queued or played:
  # each is Discarded, and those commands refuse it as a wrong state.
  # read from: docs/design/inference.md:614
  # read from: docs/design/inference.md:335
  # read from: docs/design/inference.md:628
  # read from: docs/design/inference.md:1128
  - name: inference.stream.EmitTextDelta
    input:
      - name: generation_id
        type: inference.stream.GenerationId
      - name: sequence
        type: Integer
      - name: text
        type: String
    outcomes:
      - name: unknown-generation
        when_related: {via: input.generation_id, exists: false}
        error: inference.stream.GenerationNotFound
        payload:
          inference.stream.GenerationNotFound:
            generation_id: input.generation_id
        summary: No generation carries this identity; no segment was created.
      # GenerationStateConflict.current has no payload source: ess reads a related row's fields,
      # not its held state, as a value.
      - name: stale-generation
        when_related: {via: input.generation_id, predicate: state != Active}
        error: inference.stream.GenerationStateConflict
        summary: The generation is not Active; the delta is stale and no segment was created.
      # UNMAPPED: a duplicate or decreasing sequence within one generation is not refused
      # (docs/design/inference.md:312, docs/design/inference.md:1110). A row-set guard over
      # OutputSegments (`generation_id == input.generation_id`, `sequence >= input.sequence`) is
      # refused by ess 0.60.0 beside the identity-addressed generation guards (ESS-COMMAND-009).
      # Whether the order also spans generations of one producer is open.
      - name: emitted
        creates: inference.stream.OutputSegment
        instance: segment_id
        sets:
          generation_id: input.generation_id
          run_id: {related: {via: input.generation_id, field: run_id}}
          sequence: input.sequence
          text: input.text
        emits:
          - inference.stream.TextDelta
        payload:
          inference.stream.TextDelta:
            segment_id: {generated: true}
            generation_id: input.generation_id
            sequence: input.sequence
            text: input.text
        summary: Tentative text exists; it is not yet safe to speak or publish.

  # read from: docs/design/inference.md:615
  - name: inference.stream.CommitSegment
    input:
      - name: segment_id
        type: inference.stream.SegmentId
    outcomes:
      - name: committed
        moves: inference.stream.OutputSegment.commit
        instance: segment_id
        emits:
          - inference.stream.TextSegmentCommitted
        payload:
          inference.stream.TextSegmentCommitted:
            segment_id: input.segment_id
            text: {subject: text}
        summary: The segment may be synthesised and published.
      - name: wrong-state
        wrong_state: true
        error: inference.stream.SegmentStateConflict
        payload:
          inference.stream.SegmentStateConflict:
            current: {subject: state}

  # TTS normally consumes committed output segments, not arbitrary tentative tokens: queueing a
  # Tentative segment is a wrong-state refusal. This is a deliberate restriction: speculative TTS
  # that synthesizes early in an explicitly opted-in lower-integrity mode (design line 627) is not
  # declared here.
  # read from: docs/design/inference.md:626
  # read from: docs/design/inference.md:627
  # read from: docs/design/inference.md:616
  - name: inference.stream.QueueForSynthesis
    input:
      - name: segment_id
        type: inference.stream.SegmentId
    outcomes:
      - name: queued
        moves: inference.stream.OutputSegment.queue
        instance: segment_id
        emits:
          - inference.stream.SegmentQueued
        payload:
          inference.stream.SegmentQueued:
            segment_id: input.segment_id
        summary: The committed segment is queued for synthesis and playback.
      - name: wrong-state
        wrong_state: true
        error: inference.stream.SegmentStateConflict
        payload:
          inference.stream.SegmentStateConflict:
            current: {subject: state}

  # Synthesized is distinct from queued and from played: the segment's audio exists and has not
  # been heard. The design names the TTS event SynthesisCompleted.
  # read from: docs/design/inference.md:388
  # read from: docs/design/inference.md:617
  # read from: docs/design/inference.md:336
  - name: inference.stream.CompleteSynthesis
    input:
      - name: segment_id
        type: inference.stream.SegmentId
    outcomes:
      - name: synthesized
        moves: inference.stream.OutputSegment.synthesize
        instance: segment_id
        emits:
          - inference.stream.SynthesisCompleted
        payload:
          inference.stream.SynthesisCompleted:
            segment_id: input.segment_id
        summary: The segment's audio is generated and not yet played.
      - name: wrong-state
        wrong_state: true
        error: inference.stream.SegmentStateConflict
        payload:
          inference.stream.SegmentStateConflict:
            current: {subject: state}

  # Only the client or media sink can confirm playback.
  # read from: docs/design/inference.md:388
  # read from: docs/design/inference.md:618
  - name: inference.stream.AcknowledgePlayback
    input:
      - name: segment_id
        type: inference.stream.SegmentId
    outcomes:
      - name: played
        moves: inference.stream.OutputSegment.play
        instance: segment_id
        emits:
          - inference.stream.AudioPlayed
        payload:
          inference.stream.AudioPlayed:
            segment_id: input.segment_id
        summary: The user heard it; this segment can no longer be discarded.
      - name: wrong-state
        wrong_state: true
        error: inference.stream.SegmentStateConflict
        payload:
          inference.stream.SegmentStateConflict:
            current: {subject: state}

  # Cancellation suppresses stale unplayed media and uncommitted output; it cannot unsay what the
  # user heard, so a Played segment refuses.
  # read from: docs/design/inference.md:628
  # read from: docs/design/inference.md:620
  - name: inference.stream.DiscardSegment
    input:
      - name: segment_id
        type: inference.stream.SegmentId
    outcomes:
      - name: discarded
        moves: inference.stream.OutputSegment.discard
        instance: segment_id
        emits:
          - inference.stream.SegmentDiscarded
        payload:
          inference.stream.SegmentDiscarded:
            segment_id: input.segment_id
        summary: The unplayed segment is gone and will not be spoken.
      - name: wrong-state
        wrong_state: true
        error: inference.stream.SegmentStateConflict
        payload:
          inference.stream.SegmentStateConflict:
            current: {subject: state}

events:
  # UNMAPPED: no event declares the envelope (schema_version, event_id, run_id, session_id,
  # stream_id, sequence, producer and port, timestamp, causation_id; docs/design/inference.md:303-318).
  # The fields are a SHOULD, and a version is a MUST only across process or network boundaries
  # (docs/design/inference.md:278); the inbound-text story declares them.
  # UNMAPPED: design event names not declared here (names are not frozen,
  # docs/design/inference.md:342): SpeechStarted, SpeechEnded (STT), StructuredOutput (LLM),
  # SynthesisStarted, AudioChunk and alignment updates (TTS), and the duplex family
  # (docs/design/inference.md:334-337). No command here causes them yet.
  - name: inference.stream.TurnOpened
    fields:
      - name: turn_id
        type: inference.stream.TurnId
      - name: run_id
        type: inference.graph.RunId

  - name: inference.stream.TurnCompleted
    fields:
      - name: turn_id
        type: inference.stream.TurnId

  - name: inference.stream.TranscriptHypothesis
    fields:
      - name: span_id
        type: inference.stream.SpanId
      - name: turn_id
        type: inference.stream.TurnId
      - name: sequence
        type: Integer
      - name: text
        type: String

  - name: inference.stream.TranscriptRevision
    fields:
      - name: span_id
        type: inference.stream.SpanId
      - name: text
        type: String

  - name: inference.stream.TranscriptCommitted
    fields:
      - name: span_id
        type: inference.stream.SpanId
      - name: text
        type: String

  - name: inference.stream.GenerationStarted
    fields:
      - name: generation_id
