      - name: generation_id
        type: inference.stream.GenerationId
      - name: sequence
        type: Integer
      - name: text
        type: String

  - name: inference.stream.TextSegmentCommitted
    fields:
      - name: segment_id
        type: inference.stream.SegmentId
      - name: text
        type: String

  - name: inference.stream.SegmentQueued
    fields:
      - name: segment_id
        type: inference.stream.SegmentId

  - name: inference.stream.SynthesisCompleted
    fields:
      - name: segment_id
        type: inference.stream.SegmentId

  - name: inference.stream.AudioPlayed
    fields:
      - name: segment_id
        type: inference.stream.SegmentId

  - name: inference.stream.SegmentDiscarded
    fields:
      - name: segment_id
        type: inference.stream.SegmentId

