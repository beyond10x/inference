# The model layer of docs/design/inference.md: what computation can be performed and what it
# requires (§3.2). Every declaration cites the design line it was read from; there is no code.
domain: inference.model

summary: >-
  A Model is a trained inference artifact or hosted endpoint, described by its modalities, its
  code and weight licences and its checksum. An Adapter is the concrete implementation that
  connects one model or backend to the framework's contracts; it reports the contract revision it
  implements, how and where it runs, and the capabilities it claims and must pass conformance
  tests for. Output streaming, incremental input, input during output and native duplex are
  separate capabilities: a persistent connection proves none of them.

naming:
  wire: model
  display: Model

types:
  - name: inference.model.ModelId
    kind: newtype
    of: Uuid

  - name: inference.model.AdapterId
    kind: newtype
    of: Uuid

  # The core streaming capability matrix.
  # read from: docs/design/inference.md:419-427
  - name: inference.model.Capability
    kind: enum
    variants:
      - output_streaming
      - incremental_input
      - concurrent_input_output
      - native_duplex
      - revisable_input
      - tool_calling
      - interruptible
      - resumable_model_state
      - audio_text_alignment
      # A coordinator restarting ordinary calls gives an orchestrated duplex experience; it is
      # reported apart from native_duplex and never as it.
      # read from: docs/design/inference.md:52
      # read from: docs/design/inference.md:400
      # read from: docs/design/inference.md:1143
      - orchestrated_duplex

  # First-class media modalities; the initial runtime implements Text, Audio, Structured and
  # Control.
  # read from: docs/design/inference.md:288-299
  - name: inference.model.Modality
    kind: enum
    variants: [Text, Audio, Structured, Image, Video, Control]

  # Where an adapter is allowed to run.
  # read from: docs/design/inference.md:438
  - name: inference.model.Locality
    kind: enum
    variants: [same_process, local_worker, self_hosted_cluster, external_provider]

  # The five execution forms a backend adapter may run as.
  # read from: docs/design/inference.md:876-880
  - name: inference.model.ExecutionForm
    kind: enum
    variants: [in_process, native_ffi, subprocess, local_service, hosted_service]

  - name: inference.model.CapabilityRecordId
    kind: newtype
    of: Uuid

  # The evidence for one claimed capability: the names of the conformance tests that observed
  # it. A claim is verified by its evidence, never by the claim itself.
  # read from: docs/design/inference.md:898
  # read from: docs/design/inference.md:949
  # read from: docs/design/inference.md:951
  - name: inference.model.CapabilityEvidence
    kind: struct
    fields:
      - name: capability
        type: inference.model.Capability
      - name: tests
        type: List<String>

  # What an adapter needs on one hardware target, measured there and promised nowhere else: peak
  # resident memory in MiB, model load time in milliseconds, the real-time factor on CPU in
  # thousandths (250: one second of input takes a quarter of a second), and GPU memory in MiB,
  # none when it runs without a GPU. The parts and their units are this specification's choice,
  # not the design's.
  # read from: docs/design/inference.md:434
  # read from: docs/design/inference.md:950
  - name: inference.model.ResourceProfile
    kind: struct
    fields:
      - name: peak_resident_memory_mib
        type: Integer
      - name: load_time_ms
        type: Integer
      - name: cpu_real_time_factor_milli
        type: Integer
      - name: gpu_memory_mib
        type: Optional<Integer>

entities:
  # A trained inference artifact or hosted model endpoint, described by capabilities and
  # resources; it owns model identity, modality support and constraints. Family and checkpoint,
  # code licence and weight licence as separate entries, and the artifact checksum.
  # read from: docs/design/inference.md:98
  # read from: docs/design/inference.md:433
  # read from: docs/design/inference.md:439
  # read from: docs/design/inference.md:944-952
  - name: inference.model.Model
    naming:
      summary: A trained inference artifact or hosted model endpoint.
    identity:
      name: model_id
      type: inference.model.ModelId
    fields:
      - name: family
        type: String
      - name: checkpoint
        type: String
      - name: code_license
        type: String
      - name: weight_license
        type: String
      - name: checksum
        type: String
      - name: input_modalities
        type: List<inference.model.Modality>
      - name: output_modalities
        type: List<inference.model.Modality>
      # read from: docs/design/inference.md:439
      # read from: docs/design/inference.md:946
      - name: provenance
        type: String
      # read from: docs/design/inference.md:946
      - name: source_revision
        type: String
    # A single Declared state: ESS requires a lifecycle on every entity; the design gives a model
    # no states, and no transition is planned.
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # A concrete implementation connecting a model or backend to the framework contracts; it owns
  # the model-specific transport, decoding and backend lifecycle, reports the contract revision it
  # implements, and claims capabilities it must pass the conformance tests for.
  # read from: docs/design/inference.md:99
  # read from: docs/design/inference.md:279
  # read from: docs/design/inference.md:899
  - name: inference.model.Adapter
    naming:
      summary: The concrete implementation that connects one model or backend to the contracts.
    identity:
      name: adapter_id
      type: inference.model.AdapterId
    fields:
      - name: model_id
        type: inference.model.ModelId
      - name: backend
        type: String
      - name: contract_revision
        type: String
      - name: execution_form
        type: inference.model.ExecutionForm
      - name: locality
        type: inference.model.Locality
      # The capabilities the adapter claims. Every adapter must pass the tests for its claims;
      # the evidence that it did, and its resource profile, are in its CapabilityRecord, one per
      # hardware target. Binding a node does not require a verified claim.
      # read from: docs/design/inference.md:898
      - name: capabilities
        type: List<inference.model.Capability>
      - name: max_concurrency
        type: Integer
    relations:
      # An adapter connects one model; the model artifact stands on its own.
      # read from: docs/design/inference.md:99
      - name: model
        kind: references
        target: inference.model.Model
        cardinality: one
        via: model_id
    # A single Declared state: ESS requires a lifecycle on every entity; the design gives an
    # adapter no states, and no transition is planned.
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # The machine-readable profile of one adapter on one hardware target: the reference machine it
  # was measured on, the languages and audio formats it handles, for each claimed capability the
  # conformance tests that observed it, its resource profile there and the adapter revision that
  # was measured. A second hardware target is a second record. The model is the adapter's; its
  # source, checkpoint, hashes and licences stay on the Model. That the evidence answers exactly
  # the adapter's claims is checked by the test that loads the record, not by declaring it.
  # read from: docs/design/inference.md:433
  # read from: docs/design/inference.md:435
  # read from: docs/design/inference.md:941-951
  - name: inference.model.CapabilityRecord
    naming:
      summary: The capability and resource profile of one adapter on one hardware target.
    identity:
      name: capability_record_id
      type: inference.model.CapabilityRecordId
    fields:
      - name: adapter_id
        type: inference.model.AdapterId
      - name: model_id
        type: inference.model.ModelId
      - name: hardware
        type: String
      - name: languages
        type: List<String>
      - name: audio_formats
        type: List<inference.audio.AudioFormat>
      - name: evidence
        type: List<inference.model.CapabilityEvidence>
      - name: resource_profile
        type: inference.model.ResourceProfile
      - name: adapter_revision
        type: String
    relations:
      - name: adapter
        kind: references
        target: inference.model.Adapter
        cardinality: one
        via: adapter_id
      - name: model
        kind: references
        target: inference.model.Model
        cardinality: one
        via: model_id
    # A single Declared state: ESS requires a lifecycle on every entity; the design gives a
    # record no states, and no transition is planned.
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

errors:
  # The design lists maximum concurrency among an adapter's descriptors; that it is at least
  # one is this specification's rule, not the design's.
  # read from: docs/design/inference.md:435
  - name: inference.model.NonPositiveConcurrency
    summary: An adapter's maximum concurrency must be at least one.
    fields:
      - name: submitted
        type: Integer

  # read from: docs/design/inference.md:99
  - name: inference.model.ModelNotFound
    summary: No model carries the identity the adapter named; nothing was declared.
    fields:
      - name: model_id
        type: inference.model.ModelId

  # read from: docs/design/inference.md:941-951
  - name: inference.model.AdapterNotFound
    summary: No adapter carries the identity the record named; nothing was declared.
    fields:
      - name: adapter_id
        type: inference.model.AdapterId

commands:
  - name: inference.model.DeclareModel
    input:
      - name: family
        type: String
      - name: checkpoint
        type: String
      - name: code_license
        type: String
      - name: weight_license
        type: String
      - name: checksum
        type: String
      - name: input_modalities
        type: List<inference.model.Modality>
      - name: output_modalities
        type: List<inference.model.Modality>
      # read from: docs/design/inference.md:439
      # read from: docs/design/inference.md:946
      - name: provenance
        type: String
      # read from: docs/design/inference.md:946
      - name: source_revision
        type: String
    # UNMAPPED: an empty checksum or licence is accepted. Integrity verification and a licence
    # inventory are mandatory controls (design 1058, 1119), but a model may be a hosted endpoint
    # (98) with no artifact to hash or weights to license; whether such a model declares an empty
    # value, a marker or no field is not settled. Open question for the owner.
    outcomes:
      - name: declared
        creates: inference.model.Model
        instance: model_id
        sets:
          family: input.family
          checkpoint: input.checkpoint
          code_license: input.code_license
          weight_license: input.weight_license
          checksum: input.checksum
          input_modalities: input.input_modalities
          output_modalities: input.output_modalities
          provenance: input.provenance
          source_revision: input.source_revision
        emits:
          - inference.model.ModelDeclared
        payload:
          inference.model.ModelDeclared:
            model_id: {generated: true}
            family: input.family
            checkpoint: input.checkpoint
        summary: The model is declared with its licences and checksum.

  # read from: docs/design/inference.md:435
  - name: inference.model.DeclareAdapter
    input:
      - name: model_id
        type: inference.model.ModelId
      - name: backend
        type: String
      - name: contract_revision
        type: String
      - name: execution_form
        type: inference.model.ExecutionForm
      - name: locality
        type: inference.model.Locality
      - name: capabilities
        type: List<inference.model.Capability>
      - name: max_concurrency
        type: Integer
    outcomes:
      # read from: docs/design/inference.md:99
      - name: unknown-model
        when_related: {via: input.model_id, exists: false}
        error: inference.model.ModelNotFound
        payload:
          inference.model.ModelNotFound:
            model_id: input.model_id
        summary: No model carries this identity, and nothing was declared.

      - name: declared
        when: max_concurrency > 0
        creates: inference.model.Adapter
        instance: adapter_id
        sets:
          model_id: input.model_id
          backend: input.backend
          contract_revision: input.contract_revision
          execution_form: input.execution_form
          locality: input.locality
          capabilities: input.capabilities
          max_concurrency: input.max_concurrency
        emits:
          - inference.model.AdapterDeclared
        payload:
          inference.model.AdapterDeclared:
            adapter_id: {generated: true}
            model_id: input.model_id
            capabilities: input.capabilities
        summary: The adapter is declared with the capabilities it claims.

      - name: refused
        error: inference.model.NonPositiveConcurrency
        payload:
          inference.model.NonPositiveConcurrency:
            submitted: input.max_concurrency
        summary: The concurrency limit was not positive, and nothing was declared.

  # The record names its adapter and its model, and each must be declared. That the model is the
  # adapter's, and that an adapter has one record per hardware target, are rules the adapter
  # crate keeps by taking both identities from the adapter and committing one record file per
  # target; declaring does not refuse either, because a command reads the rows of one selector in
  # this release of ESS, and synthesis witnesses no selector over the identities a declaration
  # generates.
  # read from: docs/design/inference.md:941-951
  - name: inference.model.DeclareCapabilityRecord
    input:
      - name: adapter_id
        type: inference.model.AdapterId
      - name: model_id
        type: inference.model.ModelId
      - name: hardware
        type: String
      - name: languages
        type: List<String>
      - name: audio_formats
        type: List<inference.audio.AudioFormat>
      - name: evidence
        type: List<inference.model.CapabilityEvidence>
      - name: resource_profile
        type: inference.model.ResourceProfile
      - name: adapter_revision
        type: String
    outcomes:
      - name: unknown-adapter
        when_related: {via: input.adapter_id, exists: false}
        error: inference.model.AdapterNotFound
        payload:
          inference.model.AdapterNotFound:
            adapter_id: input.adapter_id
        summary: No adapter carries this identity, and nothing was declared.

      - name: unknown-model
        when_related: {via: input.model_id, exists: false}
        error: inference.model.ModelNotFound
        payload:
          inference.model.ModelNotFound:
            model_id: input.model_id
        summary: No model carries this identity, and nothing was declared.

      - name: declared
        creates: inference.model.CapabilityRecord
        instance: capability_record_id
        sets:
          adapter_id: input.adapter_id
          model_id: input.model_id
          hardware: input.hardware
          languages: input.languages
          audio_formats: input.audio_formats
          evidence: input.evidence
          resource_profile: input.resource_profile
          adapter_revision: input.adapter_revision
        emits:
          - inference.model.CapabilityRecordDeclared
        payload:
          inference.model.CapabilityRecordDeclared:
            capability_record_id: {generated: true}
            adapter_id: input.adapter_id
            model_id: input.model_id
            hardware: input.hardware
        summary: The record is declared for the adapter, its model and the hardware target.

events:
  - name: inference.model.ModelDeclared
    fields:
      - name: model_id
        type: inference.model.ModelId
      - name: family
        type: String
      - name: checkpoint
        type: String

  - name: inference.model.AdapterDeclared
    fields:
      - name: adapter_id
        type: inference.model.AdapterId
      - name: model_id
        type: inference.model.ModelId
      - name: capabilities
        type: List<inference.model.Capability>

  - name: inference.model.CapabilityRecordDeclared
    fields:
      - name: capability_record_id
        type: inference.model.CapabilityRecordId
      - name: adapter_id
        type: inference.model.AdapterId
      - name: model_id
        type: inference.model.ModelId
      - name: hardware
        type: String

views:
  - name: inference.model.Models
    source: inference.model.Model
    consistency: read_your_writes
    fields:
      - name: model_id
        type: inference.model.ModelId
      - name: family
        type: String
      - name: checkpoint
        type: String
      - name: code_license
        type: String
      - name: weight_license
        type: String
      # read from: docs/design/inference.md:434
      # read from: docs/design/inference.md:439
      - name: checksum
        type: String
      - name: input_modalities
        type: List<inference.model.Modality>
      - name: output_modalities
        type: List<inference.model.Modality>
      - name: provenance
        type: String
      - name: source_revision
        type: String

  - name: inference.model.Adapters
    source: inference.model.Adapter
    consistency: read_your_writes
    fields:
      - name: adapter_id
        type: inference.model.AdapterId
      - name: model_id
        type: inference.model.ModelId
      # read from: docs/design/inference.md:433
      - name: backend
        type: String
      - name: contract_revision
        type: String
      # read from: docs/design/inference.md:876-882
      - name: execution_form
        type: inference.model.ExecutionForm
      - name: locality
        type: inference.model.Locality
      - name: capabilities
        type: List<inference.model.Capability>
      - name: max_concurrency
        type: Integer

  # read from: docs/design/inference.md:941-951
  - name: inference.model.CapabilityRecords
    source: inference.model.CapabilityRecord
    consistency: read_your_writes
    fields:
      - name: capability_record_id
        type: inference.model.CapabilityRecordId
      - name: adapter_id
        type: inference.model.AdapterId
      - name: model_id
        type: inference.model.ModelId
      - name: hardware
        type: String
      - name: languages
        type: List<String>
      - name: audio_formats
        type: List<inference.audio.AudioFormat>
      - name: evidence
        type: List<inference.model.CapabilityEvidence>
      - name: resource_profile
        type: inference.model.ResourceProfile
      - name: adapter_revision
        type: String
