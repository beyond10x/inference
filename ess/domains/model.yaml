# The model layer of docs/design/inference.md: what computation can be performed and what it
# requires (§3.2). Every declaration cites the design line it was read from; there is no code.
domain: inference.model

summary: >-
  A Model is a trained inference artifact or hosted endpoint, described by its modalities, its
  code and weight licences and its checksum. An Adapter is the concrete implementation that
  connects one model or backend to the framework's contracts; it reports the contract revision it
  implements, how and where it runs, and the capabilities it claims and must pass conformance
  tests for. Output streaming, incremental input, input during output and native duplex are
  separate capabilities: a persistent connection proves none of them.

naming:
  wire: model
  display: Model

types:
  - name: inference.model.ModelId
    kind: newtype
    of: Uuid

  - name: inference.model.AdapterId
    kind: newtype
    of: Uuid

  # The core streaming capability matrix.
  # read from: docs/design/inference.md:419-427
  - name: inference.model.Capability
    kind: enum
    variants:
      - output_streaming
      - incremental_input
      - concurrent_input_output
      - native_duplex
      - revisable_input
      - tool_calling
      - interruptible
      - resumable_model_state
      - audio_text_alignment
      # A coordinator restarting ordinary calls gives an orchestrated duplex experience; it is
      # reported apart from native_duplex and never as it.
      # read from: docs/design/inference.md:52
      # read from: docs/design/inference.md:400
      # read from: docs/design/inference.md:1143
      - orchestrated_duplex

  # First-class media modalities; the initial runtime implements Text, Audio, Structured and
  # Control.
  # read from: docs/design/inference.md:288-299
  - name: inference.model.Modality
    kind: enum
    variants: [Text, Audio, Structured, Image, Video, Control]

  # Where an adapter is allowed to run.
  # read from: docs/design/inference.md:438
  - name: inference.model.Locality
    kind: enum
    variants: [same_process, local_worker, self_hosted_cluster, external_provider]

  # The five execution forms a backend adapter may run as.
  # read from: docs/design/inference.md:876-880
  - name: inference.model.ExecutionForm
    kind: enum
    variants: [in_process, native_ffi, subprocess, local_service, hosted_service]

entities:
  # A trained inference artifact or hosted model endpoint, described by capabilities and
  # resources; it owns model identity, modality support and constraints. Family and checkpoint,
  # code licence and weight licence as separate entries, and the artifact checksum.
  # read from: docs/design/inference.md:98
  # read from: docs/design/inference.md:433
  # read from: docs/design/inference.md:439
  # read from: docs/design/inference.md:944-952
  - name: inference.model.Model
    naming:
      summary: A trained inference artifact or hosted model endpoint.
    identity:
      name: model_id
      type: inference.model.ModelId
    fields:
      - name: family
        type: String
      - name: checkpoint
        type: String
      - name: code_license
        type: String
      - name: weight_license
        type: String
      - name: checksum
        type: String
      - name: input_modalities
        type: List<inference.model.Modality>
      - name: output_modalities
        type: List<inference.model.Modality>
      # read from: docs/design/inference.md:439
      # read from: docs/design/inference.md:946
      - name: provenance
        type: String
      # read from: docs/design/inference.md:946
      - name: source_revision
        type: String
    # A single Declared state: ESS requires a lifecycle on every entity; the design gives a model
    # no states, and no transition is planned.
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # A concrete implementation connecting a model or backend to the framework contracts; it owns
  # the model-specific transport, decoding and backend lifecycle, reports the contract revision it
  # implements, and claims capabilities it must pass the conformance tests for.
  # read from: docs/design/inference.md:99
  # read from: docs/design/inference.md:279
  # read from: docs/design/inference.md:899
  - name: inference.model.Adapter
    naming:
      summary: The concrete implementation that connects one model or backend to the contracts.
    identity:
      name: adapter_id
      type: inference.model.AdapterId
    fields:
      - name: model_id
        type: inference.model.ModelId
      - name: backend
        type: String
      - name: contract_revision
        type: String
      - name: execution_form
        type: inference.model.ExecutionForm
      - name: locality
        type: inference.model.Locality
      # The capabilities the adapter claims. Every adapter must pass the tests for its claims.
      # read from: docs/design/inference.md:899
      # UNMAPPED: a claimed capability and a verified one look the same. The design asks for
      # evidence, the adapter revision and conformance-suite results per integration (899, 950,
      # 952) and the review names a CapabilityDescriptor noun; what that record holds, and whether
      # binding a node requires a verified claim, is not settled. Open question for the owner.
      - name: capabilities
        type: List<inference.model.Capability>
      - name: max_concurrency
        type: Integer
      # UNMAPPED: the resource plan (expected startup footprint, CPU and GPU memory needs,
      # admission limits; design 435, 951) has no field: the design lists its parts without a
      # shape or units. Open question for the owner.
    relations:
      # An adapter connects one model; the model artifact stands on its own.
      # read from: docs/design/inference.md:99
      - name: model
        kind: references
        target: inference.model.Model
        cardinality: one
        via: model_id
    # A single Declared state: ESS requires a lifecycle on every entity; the design gives an
    # adapter no states, and no transition is planned.
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

errors:
  # The design lists maximum concurrency among an adapter's descriptors; that it is at least
  # one is this specification's rule, not the design's.
  # read from: docs/design/inference.md:435
  - name: inference.model.NonPositiveConcurrency
    summary: An adapter's maximum concurrency must be at least one.
    fields:
      - name: submitted
        type: Integer

  # read from: docs/design/inference.md:99
  - name: inference.model.ModelNotFound
    summary: No model carries the identity the adapter named; nothing was declared.
    fields:
      - name: model_id
        type: inference.model.ModelId

commands:
  - name: inference.model.DeclareModel
    input:
      - name: family
        type: String
      - name: checkpoint
        type: String
      - name: code_license
        type: String
      - name: weight_license
        type: String
      - name: checksum
        type: String
      - name: input_modalities
        type: List<inference.model.Modality>
      - name: output_modalities
        type: List<inference.model.Modality>
      # read from: docs/design/inference.md:439
      # read from: docs/design/inference.md:946
      - name: provenance
        type: String
      # read from: docs/design/inference.md:946
      - name: source_revision
        type: String
    # UNMAPPED: an empty checksum or licence is accepted. Integrity verification and a licence
    # inventory are mandatory controls (design 1058, 1119), but a model may be a hosted endpoint
    # (98) with no artifact to hash or weights to license; whether such a model declares an empty
    # value, a marker or no field is not settled. Open question for the owner.
    outcomes:
      - name: declared
        creates: inference.model.Model
        instance: model_id
        sets:
          family: input.family
          checkpoint: input.checkpoint
          code_license: input.code_license
          weight_license: input.weight_license
          checksum: input.checksum
          input_modalities: input.input_modalities
          output_modalities: input.output_modalities
          provenance: input.provenance
          source_revision: input.source_revision
        emits:
          - inference.model.ModelDeclared
        payload:
          inference.model.ModelDeclared:
            model_id: {generated: true}
            family: input.family
            checkpoint: input.checkpoint
        summary: The model is declared with its licences and checksum.

  # read from: docs/design/inference.md:435
  - name: inference.model.DeclareAdapter
    input:
      - name: model_id
        type: inference.model.ModelId
      - name: backend
        type: String
      - name: contract_revision
        type: String
      - name: execution_form
        type: inference.model.ExecutionForm
      - name: locality
        type: inference.model.Locality
      - name: capabilities
        type: List<inference.model.Capability>
      - name: max_concurrency
        type: Integer
    outcomes:
      # read from: docs/design/inference.md:99
      - name: unknown-model
        when_related: {via: input.model_id, exists: false}
        error: inference.model.ModelNotFound
        payload:
          inference.model.ModelNotFound:
            model_id: input.model_id
        summary: No model carries this identity, and nothing was declared.

      - name: declared
        when: max_concurrency > 0
        creates: inference.model.Adapter
        instance: adapter_id
        sets:
          model_id: input.model_id
          backend: input.backend
          contract_revision: input.contract_revision
          execution_form: input.execution_form
          locality: input.locality
          capabilities: input.capabilities
          max_concurrency: input.max_concurrency
        emits:
          - inference.model.AdapterDeclared
        payload:
          inference.model.AdapterDeclared:
            adapter_id: {generated: true}
            model_id: input.model_id
            capabilities: input.capabilities
        summary: The adapter is declared with the capabilities it claims.

      - name: refused
        error: inference.model.NonPositiveConcurrency
        payload:
          inference.model.NonPositiveConcurrency:
            submitted: input.max_concurrency
        summary: The concurrency limit was not positive, and nothing was declared.

events:
  - name: inference.model.ModelDeclared
    fields:
      - name: model_id
        type: inference.model.ModelId
      - name: family
        type: String
      - name: checkpoint
        type: String

  - name: inference.model.AdapterDeclared
    fields:
      - name: adapter_id
        type: inference.model.AdapterId
      - name: model_id
        type: inference.model.ModelId
      - name: capabilities
        type: List<inference.model.Capability>

views:
  - name: inference.model.Models
    source: inference.model.Model
    consistency: read_your_writes
    fields:
      - name: model_id
        type: inference.model.ModelId
      - name: family
        type: String
      - name: checkpoint
        type: String
      - name: code_license
        type: String
      - name: weight_license
        type: String
      # read from: docs/design/inference.md:434
      # read from: docs/design/inference.md:439
      - name: checksum
        type: String
      - name: input_modalities
        type: List<inference.model.Modality>
      - name: output_modalities
        type: List<inference.model.Modality>
      - name: provenance
        type: String
      - name: source_revision
        type: String

  - name: inference.model.Adapters
    source: inference.model.Adapter
    consistency: read_your_writes
    fields:
      - name: adapter_id
        type: inference.model.AdapterId
      - name: model_id
        type: inference.model.ModelId
      # read from: docs/design/inference.md:433
      - name: backend
        type: String
      - name: contract_revision
        type: String
      # read from: docs/design/inference.md:876-882
      - name: execution_form
        type: inference.model.ExecutionForm
      - name: locality
        type: inference.model.Locality
      - name: capabilities
        type: List<inference.model.Capability>
      - name: max_concurrency
        type: Integer
