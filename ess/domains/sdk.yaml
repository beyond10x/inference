# The SDK's own nouns (docs/design/sdk.md): a stack binds each role to one adapter under one
# deployment profile, and a recipe is a named topology that, instantiated over a stack, declares and
# plans one pipeline. Everything else the SDK offers (agents, chats, events, tools) is a view over
# the session, graph, stream and tools domains and declares nothing here.
# UNMAPPED: the command that instantiates a recipe, with its refusals (a role the recipe needs
# that the stack does not bind), is story:sdk-recipes' to declare. InstantiateRecipe's outcomes
# are instantiated, role-unbound and profile-denies, the last a bound adapter whose locality the
# stack's profile does not admit (inference.graph.PlanPipeline locality-denied, carried as the
# SDK's ProfileDenies). RegisterRecipe, also story:sdk-recipes',
# has the outcomes registered and name-taken (a name a built-in or an earlier registration holds).
# read from: docs/design/sdk.md §3.3, §4
domain: inference.sdk

summary: >-
  A Stack binds each role (stt, llm, tts, speech) to one adapter and names the deployment profile it
  runs under; it records where each binding came from. A Recipe is a named, parameterised topology
  in one interaction mode that needs a set of roles. An Instantiation is one recipe planned over one
  stack into one pipeline.

naming:
  wire: sdk
  display: SDK

types:
  - name: inference.sdk.StackId
    kind: newtype
    of: Uuid

  - name: inference.sdk.StackBindingId
    kind: newtype
    of: Uuid

  - name: inference.sdk.InstantiationId
    kind: newtype
    of: Uuid

  # A recipe's registered name, such as `voice_cascade`.
  # read from: docs/design/sdk.md §3.3
  - name: inference.sdk.RecipeName
    kind: newtype
    of: String

  # read from: docs/design/sdk.md §4.1
  - name: inference.sdk.Role
    kind: enum
    variants: [stt, llm, tts, speech]

  # Where a binding came from, first found wins in this order.
  # read from: docs/design/sdk.md §4.2
  - name: inference.sdk.BindingSource
    kind: enum
    variants: [builder, environment, stack_file, working_directory_file, user_config_file]

  # One role named to one adapter by the name it is registered under, and the source that named
  # it: what a stack reads before it resolves.
  # read from: docs/design/sdk.md §4.1-4.2
  - name: inference.sdk.RoleBinding
    kind: struct
    fields:
      - name: role
        type: inference.sdk.Role
      - name: adapter
        type: String
      - name: source
        type: inference.sdk.BindingSource

entities:
  # read from: docs/design/sdk.md §4.1
  # read from: docs/design/sdk.md §4.3
  - name: inference.sdk.Stack
    naming:
      summary: One adapter per role under one deployment profile.
    identity:
      name: stack_id
      type: inference.sdk.StackId
    fields:
      - name: profile_id
        type: inference.policy.ProfileId
    relations:
      - name: profile
        kind: references
        target: inference.policy.DeploymentProfile
        cardinality: one
        via: profile_id
      - name: bindings
        kind: owns
        target: inference.sdk.StackBinding
        cardinality: many
        via: stack_id
    lifecycle:
      initial: Resolved
      states: [Resolved]
      terminal: [Resolved]

  # At most one binding per role and stack: inference.sdk.ResolveStack refuses a role bound twice.
  # read from: docs/design/sdk.md §4.1-4.2
  - name: inference.sdk.StackBinding
    naming:
      summary: One role of a stack bound to one adapter, and where that came from.
    identity:
      name: stack_binding_id
      type: inference.sdk.StackBindingId
    fields:
      - name: stack_id
        type: inference.sdk.StackId
      - name: role
        type: inference.sdk.Role
      - name: adapter_id
        type: inference.model.AdapterId
      - name: source
        type: inference.sdk.BindingSource
    relations:
      - name: adapter
        kind: references
        target: inference.model.Adapter
        cardinality: one
        via: adapter_id
    lifecycle:
      initial: Bound
      states: [Bound]
      terminal: [Bound]

  # read from: docs/design/sdk.md §3.3
  - name: inference.sdk.Recipe
    naming:
      summary: A named, parameterised topology in one interaction mode that needs a set of roles.
    identity:
      name: name
      type: inference.sdk.RecipeName
    fields:
      - name: mode
        type: inference.graph.InteractionMode
      - name: roles
        type: List<inference.sdk.Role>
    lifecycle:
      initial: Registered
      states: [Registered]
      terminal: [Registered]

  # One recipe planned over one stack into one pipeline. A pipeline declared without a recipe has
  # no instantiation, so the graph domain is unchanged.
  # read from: docs/design/sdk.md §3.3
  - name: inference.sdk.Instantiation
    naming:
      summary: One recipe planned over one stack into one pipeline.
    identity:
      name: instantiation_id
      type: inference.sdk.InstantiationId
    fields:
      - name: recipe
        type: inference.sdk.RecipeName
      - name: stack_id
        type: inference.sdk.StackId
      - name: pipeline_id
        type: inference.graph.PipelineId
    relations:
      - name: recipe
        kind: references
        target: inference.sdk.Recipe
        cardinality: one
        via: recipe
      - name: stack
        kind: references
        target: inference.sdk.Stack
        cardinality: one
        via: stack_id
      - name: pipeline
        kind: references
        target: inference.graph.Pipeline
        cardinality: one
        via: pipeline_id
    lifecycle:
      initial: Planned
      states: [Planned]
      terminal: [Planned]

errors:
  # read from: docs/design/sdk.md §4.1
  - name: inference.sdk.RoleBoundTwice
    summary: One source binds a role twice; nothing was resolved.
    fields:
      - name: role
        type: inference.sdk.Role

  # read from: docs/design/sdk.md §4.4
  - name: inference.sdk.AdapterNotRegistered
    summary: A binding names an adapter no registration of this build holds; nothing was resolved.
    fields:
      - name: adapter
        type: String

  # read from: docs/design/sdk.md §4.3
  - name: inference.sdk.LocalityDenied
    summary: A bound adapter runs at a locality the stack's deployment profile does not admit.
    fields:
      - name: role
        type: inference.sdk.Role
      - name: adapter_id
        type: inference.model.AdapterId
      - name: locality
        type: inference.model.Locality
      - name: profile_id
        type: inference.policy.ProfileId

commands:
  # The bindings are the first found per role across the sources, in the order of
  # inference.sdk.BindingSource; a role no source names stays unbound. The stack declares its
  # profile through inference.policy.DeclareProfile with the egress and the localities the
  # profile table gives the kind, and each bound adapter through inference.model.DeclareAdapter.
  # Resolving reads no credential and opens no connection.
  # read from: docs/design/sdk.md §4.1-4.4
  - name: inference.sdk.ResolveStack
    input:
      - name: profile
        type: inference.policy.ProfileKind
      - name: bindings
        type: List<inference.sdk.RoleBinding>
    outcomes:
      # A role two bindings of one source name; the comparison of list members with each other is
      # the resolver's, as no guard compares them.
      # read from: docs/design/sdk.md §4.1
      - name: role-bound-twice
        external: two bindings of one source name the same role
        error: inference.sdk.RoleBoundTwice
        payload:
          inference.sdk.RoleBoundTwice:
            role: {generated: true}
        summary: Resolving fails naming the role, and no stack exists.

      # A name is a built-in whose feature is off (the SDK's AdapterNotCompiled, naming the
      # feature) or no registration's at all; the registry is the process's, not a row.
      # read from: docs/design/sdk.md §4.4
      - name: unknown-adapter
        external: a binding names an adapter no registration of this build holds
        error: inference.sdk.AdapterNotRegistered
        payload:
          inference.sdk.AdapterNotRegistered:
            adapter: {generated: true}
        summary: Resolving fails naming the adapter, and no stack exists.

      # The stack's profile does not admit a bound adapter's locality. The SDK resolves such a
      # stack and refuses it when a recipe plans over it (inference.graph.PlanPipeline
      # locality-denied, carried as the SDK's ProfileDenies); a stack binding a hosted adapter
      # names hybrid_opt_in.
      # read from: docs/design/sdk.md §4.3
      - name: locality-denied
        external: a bound adapter runs at a locality the profile the stack declares through inference.policy does not admit
        error: inference.sdk.LocalityDenied
        payload:
          inference.sdk.LocalityDenied:
            role: {generated: true}
            adapter_id: {generated: true}
            locality: {generated: true}
            profile_id: {generated: true}
        summary: Using the stack fails naming the role, its adapter, the locality and the profile.

      - name: resolved
        creates: inference.sdk.Stack
        instance: stack_id
        sets:
          profile_id: {generated: true}
        emits:
          - inference.sdk.StackResolved
        payload:
          inference.sdk.StackResolved:
            stack_id: {generated: true}
            profile_id: {generated: true}
            bindings: input.bindings
        summary: The stack binds each named role to its first-found adapter under its profile.

events:
  # read from: docs/design/sdk.md §4.2
  - name: inference.sdk.StackResolved
    fields:
      - name: stack_id
        type: inference.sdk.StackId
      - name: profile_id
        type: inference.policy.ProfileId
      - name: bindings
        type: List<inference.sdk.RoleBinding>
